<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TS Player</title>
    <!-- Load mpegts.js -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>
    <style>
        body { margin: 0; background: black; }
        video { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <video id="videoElement" controls autoplay muted></video>

    <script>
        if (mpegts.getFeatureList().mseLivePlayback) {
            var videoElement = document.getElementById('videoElement');
            var player = mpegts.createPlayer({
                type: 'mse',  
                isLive: true,
                url: 'http://datahub11.com:80/live/johannes/johannes123/703299.ts'
            });
            player.attachMediaElement(videoElement);
            player.load();
            player.play();
        }
    </script>
</body>
</html>
