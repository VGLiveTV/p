<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Stream Player</title>
    <meta name="referrer" content="no-referrer">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .player-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<div class="player-container">
    <video id="video" controls autoplay muted playsinline></video>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const video = document.getElementById("video");
    
    // 1. Raw Stream URL
    const rawStreamUrl = "https://sl.vodep39240327.workers.dev/channel/SONY%20TEN%203%20HD.m3u8";
    
    // 2. Path-based Proxy URL (Forces master files AND individual chunks to route through your proxy)
    const finalUrl = "https://stream-proxy.vgtv.workers.dev/" + rawStreamUrl;

    if (Hls.isSupported()) {
        const hls = new Hls({
            maxBufferLength: 10,
            liveSyncDurationCount: 3,
            enableWorker: true,
            lowLatencyMode: true
        });

        hls.loadSource(finalUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(err => console.log("Autoplay prevented:", err));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        console.error("Network error encountered, trying to recover...", data);
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        console.error("Media error encountered, trying to recover...", data);
                        hls.recoverMediaError();
                        break;
                    default:
                        console.error("Unrecoverable error:", data);
                        break;
                }
            }
        });
    } 
    // Fallback for native Safari HLS supporting browsers
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = finalUrl;
        video.addEventListener('loadedmetadata', () => {
            video.play().catch(err => console.log("Autoplay prevented:", err));
        });
    }
});
</script>

</body>
</html>
