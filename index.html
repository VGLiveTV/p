<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricLive</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f3f3;
}

.header{
background:#009270;
color:white;
padding:15px;
font-size:28px;
font-weight:bold;
text-align:center;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.matches{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.live{
color:red;
font-weight:bold;
margin-bottom:10px;
}

.title{
font-weight:bold;
margin-bottom:15px;
}

.team{
display:flex;
justify-content:space-between;
margin:8px 0;
}

.score{
font-weight:bold;
color:#009270;
}

.status{
margin-top:12px;
padding-top:12px;
border-top:1px solid #eee;
color:#666;
font-size:14px;
}

.loading{
text-align:center;
padding:40px;
font-size:18px;
}

.refresh{
display:block;
margin:20px auto;
padding:10px 20px;
border:none;
background:#009270;
color:white;
border-radius:8px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="header">
🏏 CricLive
</div>

<div class="container">

<button class="refresh" onclick="loadMatches()">
Refresh Scores
</button>

<div id="matches" class="matches">
<div class="loading">Loading live matches...</div>
</div>

</div>

<script>

const API_KEY = "YOUR_API_KEY_HERE";

async function loadMatches(){

const container = document.getElementById("matches");

container.innerHTML =
'<div class="loading">Loading...</div>';

try{

const response = await fetch(
`https://api.cricapi.com/v1/currentMatches?apikey=${API_KEY}&offset=0`
);

const result = await response.json();

if(!result.data || result.data.length === 0){

container.innerHTML =
'<div class="loading">No live matches found.</div>';

return;
}

container.innerHTML = "";

result.data.forEach(match => {

let scoreHTML = "";

if(match.score && match.score.length){

match.score.forEach(innings => {

scoreHTML += `
<div class="team">
<span>${innings.inning}</span>
<span class="score">
${innings.r}/${innings.w}
(${innings.o})
</span>
</div>
`;

});

}else{

scoreHTML =
'<div class="team"><span>Score not available</span></div>';
}

container.innerHTML += `

<div class="card">

<div class="live">🔴 LIVE</div>

<div class="title">
${match.name || "Match"}
</div>

${scoreHTML}

<div class="status">
${match.status || ""}
</div>

</div>

`;

});

}catch(error){

console.error(error);

container.innerHTML =
'<div class="loading">Failed to load live data.</div>';
}
}

loadMatches();

setInterval(loadMatches,30000);

</script>

</body>
</html>
