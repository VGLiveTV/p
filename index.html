<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sony Sports Ten 3 HD</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
        video { width: 100vw; height: 100vh; outline: none; object-fit: contain; }
    </style>
</head>
<body>

    <video id="video" controls autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('video');
        
        // Your target stream
        const streamUrl = "https://sonychannel.neyini4157.workers.dev/channel/Sony%20Sports%20Ten%203%20HD.m3u8";
        
        // Your custom proxy base
        const proxyBase = "https://stream-proxy.vgtv.workers.dev/";

        if (Hls.isSupported()) {
            const hls = new Hls({
                maxBufferLength: 30,
                // THE MAGIC FIX: Intercept every network request and route it through the proxy
                xhrSetup: function(xhr, url) {
                    if (!url.startsWith(proxyBase)) {
                        xhr.open('GET', proxyBase + url, true);
                    }
                }
            });
            
            // Load the target stream (the xhrSetup will automatically wrap it in the proxy)
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => console.log("Click play to start video."));
            });
            
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.error("Stream Error:", data);
                }
            });
            
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback for Safari
            video.src = proxyBase + streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
