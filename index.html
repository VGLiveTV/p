<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Star Sports</title>
<link id="favicon" rel="icon" type="image/png" href="https://i.postimg.cc/L4TyB9tJ/star-sports.png">
<meta name="referrer" content="no-referrer">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" />

<style>
    /* --- Universal Resets --- */
    * { margin:0; padding:0; box-sizing:border-box; }
    
    html, body {
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
    }

    /* --- Dashboard Styles --- */
    #dashboard-view {
        display: none;
        padding: 30px;
        min-height: 100%;
        overflow-y: auto;
    }
    
    h1 { margin-bottom: 30px; color: #38bdf8; text-align: center; }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 25px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .card {
        background: #1e293b;
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,.4);
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
        border: 2px solid transparent;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .card:hover { transform: translateY(-8px); border-color: #38bdf8; }

    .card img {
        width: 100%;
        height: 120px;
        object-fit: contain;
        background: #0b0f19;
        border-radius: 10px;
        margin-bottom: 15px;
        padding: 10px;
    }

    .card h2 { color: #f1f5f9; font-size: 16px; font-weight: 600; }

    /* --- Player Styles --- */
    #player-view {
        display: none;
        width: 100%;
        height: 100%;
        background: #000;
        position: absolute;
        top: 0;
        left: 0;
    }

    .shaka-video-container {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }
</style>
</head>
<body>

<div id="dashboard-view">
    <h1>Star Sports</h1>
    <div class="container" id="channels">
        <p style="grid-column: 1/-1; text-align: center;">Loading channels...</p>
    </div>
</div>

<div id="player-view">
    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay playsinline preload="metadata"></video>
    </div>
</div>

<script>
    const JSON_URL = "https://binge-giotv.pages.dev/data/id.json";

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('id');

        if (channelId) {
            document.body.style.background = "#000";
            document.body.style.overflow = "hidden";
            document.getElementById('player-view').style.display = 'block';
            await initPlayer(channelId);
        } else {
            document.getElementById('dashboard-view').style.display = 'block';
            await initDashboard();
        }
    });

    async function initDashboard() {
        try {
            const res = await fetch(JSON_URL, { cache: "no-store" });
            const data = await res.json();
            const channels = data.channels || (Array.isArray(data) ? data : Object.values(data));
            
            let html = "";
            channels.forEach((channel) => {
                const title = channel.name || channel.title;
                html += `
                <a href="?id=${encodeURIComponent(title)}" target="_blank" class="card">
                    <img src="${channel.logo}" alt="${title}" onerror="this.src='https://ui-avatars.com/api/?name=TV&background=0b0f19&color=fff'">
                    <h2>${title}</h2>
                </a>
                `;
            });
            document.getElementById("channels").innerHTML = html;
        } catch (err) {
            document.getElementById("channels").innerHTML = `<p style="color:red; text-align:center;">Failed to load database.</p>`;
        }
    }

    async function initPlayer(targetName) {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) return;

        const videoEl = document.getElementById('video');
        const container = document.getElementById('player-container');

        let channel = null;
        try {
            const res = await fetch(JSON_URL, { cache: "no-store" });
            const data = await res.json();
            const allChannels = data.channels || (Array.isArray(data) ? data : Object.values(data));
            channel = allChannels.find(c => (c.name || c.title) === targetName);
        } catch (e) {
            console.error("Database error.");
            return;
        }

        if (!channel) return;

        document.title = channel.name || channel.title;
        if (channel.logo) document.getElementById('favicon').href = channel.logo;

        const streamUrl = channel.url || channel.streamUrl || "";
        const kid = channel.keyId || channel.kid || "";
        const key = channel.key || channel.k || "";
        const cookieHeader = channel.cookie || channel.cookieHeader || "";

        const player = new shaka.Player(videoEl);
        const ui = new shaka.ui.Overlay(player, container, videoEl);

        ui.configure({
            addBigPlayButton: true,
            addSeekBar: false,
            controlPanelElements: ['play_pause','time_and_duration','mute','volume','spacer','overflow_menu','fullscreen'],
            seekBarColors: { base: 'white', buffered: 'red', played: 'green' }
        });

        let drmConfig = { clearKeys: {} };
        if (kid && key && kid !== "Null" && key !== "Null") {
            drmConfig.clearKeys[kid] = key;
        }

        player.configure({
            drm: drmConfig,
            manifest: { defaultPresentationDelay: 5 },
            streaming: { safeSeekOffset: 5, bufferingGoal: 10, rebufferingGoal: 2, lowLatencyMode: true }
        });

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['Referer'] = 'https://www.jiotv.com/';
            request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';

            if (cookieHeader && cookieHeader !== "PUT_YOUR_COOKIE_HERE" && cookieHeader !== "N/A") {
                request.headers['Cookie'] = cookieHeader;

                if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                     type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
                     !request.uris[0].includes('__hdnea__')) {
                    const sep = request.uris[0].includes('?') ? '&' : '?';
                    let urlCookie = cookieHeader.startsWith("__hdnea__=") ? cookieHeader.substring(10) : cookieHeader;
                    request.uris[0] += sep + "__hdnea__=" + urlCookie;
                }
            }
        });

        try {
            await player.load(streamUrl);
            videoEl.play();
        } catch (e) {
            console.error("Stream Load Error:", e);
            if (e.code === 6001) { 
                player.configure({ drm: {} });
                try { 
                    await player.load(streamUrl); 
                    videoEl.play(); 
                } catch(err){}
            }
        }
    }
</script>
</body>
</html>
