<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    
    <title>VG TV - Channels</title>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-border: #334155;
            --accent: #e50914;
            --text: #f8fafc;
            --sub-text: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        /* --- Header & Filters --- */
        .header {
            padding: 15px 20px;
            background: #0b1120;
            border-bottom: 2px solid var(--accent);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .header h1 { font-size: 20px; font-weight: bold; color: var(--accent); margin-right: 10px; white-space: nowrap;}

        .filter-group { 
            display: flex; 
            gap: 10px; 
            flex: 1;
            min-width: 250px;
        }

        select, input { 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid var(--card-border); 
            background: #000; 
            color: #fff; 
            outline: none; 
            font-size: 14px; 
            cursor: pointer;
            transition: 0.3s;
        }
        
        input[type="text"] { flex: 1; min-width: 150px; }
        select { min-width: 200px; font-weight: bold; }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(229, 9, 20, 0.4); }

        /* --- Grid Layout --- */
        .grid-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            align-content: start;
        }

        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            border: 1px solid var(--card-border); 
            cursor: pointer;
            transition: all 0.2s ease; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .card:hover { 
            border-color: var(--accent); 
            transform: translateY(-5px); 
            box-shadow: 0 8px 15px rgba(229, 9, 20, 0.2);
        }

        .card img { 
            width: 80px; 
            height: 80px; 
            object-fit: contain; 
            background: #fff; 
            border-radius: 8px; 
            padding: 5px; 
            margin-bottom: 12px; 
        }

        .card-title { 
            font-size: 14px; 
            font-weight: bold; 
            width: 100%;
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis; 
            margin-bottom: 8px;
        }

        .card-badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            color: var(--sub-text);
            border-left: 2px solid var(--accent);
            text-transform: uppercase;
        }

        .status-msg { grid-column: 1/-1; text-align: center; color: var(--sub-text); padding: 40px; font-size: 16px; }

        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        
        .modal-header {
            padding: 20px;
            background: #0b1120;
            border-bottom: 1px solid var(--card-border);
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .modal-header img { width: 60px; height: 60px; object-fit: contain; background: #fff; border-radius: 8px; padding: 4px; }
        .modal-header-text h2 { font-size: 18px; color: #fff; margin-bottom: 5px; }
        
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            color: var(--sub-text); font-size: 28px;
            cursor: pointer; line-height: 1; transition: 0.2s;
        }
        .close-btn:hover { color: var(--accent); }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .data-group {
            background: #0b1120;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px 15px;
        }
        .data-label {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.5px;
        }
        .data-value {
            font-size: 13px;
            color: #e2e8f0;
            font-family: monospace;
            word-break: break-all;
            user-select: all; 
        }
        .data-value.cookie { color: #10b981; max-height: 80px; overflow-y: auto;}

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 600px) {
            .header { flex-direction: column; padding: 15px; }
            .filter-group { flex-direction: column; width: 100%; }
            select { width: 100%; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); padding: 15px; gap: 10px; }
            .modal-content { width: 95%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📺 VG TV</h1>
        
        <div class="filter-group">
            <input type="text" id="searchInput" placeholder="Search channels...">
            <select id="catFilter">
                <option value="all">All Categories</option>
            </select>
        </div>
    </div>

    <div id="grid" class="grid-container">
        <div class="status-msg">Fetching Channels Data...</div>
    </div>

    <div id="dataModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <img id="modalImg" src="" alt="Channel Logo" referrerpolicy="no-referrer">
                <div class="modal-header-text">
                    <h2 id="modalTitle">Channel Name</h2>
                    <span id="modalCategory" class="card-badge">Category</span>
                </div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <div class="data-group">
                    <span class="data-label">Stream URL (Cleaned to .mpd)</span>
                    <div id="modalUrl" class="data-value">...</div>
                </div>
                <div class="data-group">
                    <span class="data-label">Key ID (KID)</span>
                    <div id="modalKeyId" class="data-value">...</div>
                </div>
                <div class="data-group">
                    <span class="data-label">Key</span>
                    <div id="modalKey" class="data-value">...</div>
                </div>
                <div class="data-group">
                    <span class="data-label">Auth Cookie</span>
                    <div id="modalCookie" class="data-value cookie">...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/vaathala00/jo/refs/heads/main/stream.json";
        
        let allChannels = [];
        
        // DOM Elements
        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');
        const catFilter = document.getElementById('catFilter');
        const modal = document.getElementById('dataModal');

        // 1. Fetch JSON Data
        async function loadChannels() {
            try {
                let res = await fetch(API_URL);
                if (!res.ok) {
                    res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(API_URL));
                }
                if (!res.ok) throw new Error("Failed to load JSON file.");

                const rawData = await res.json();
                
                // Locate Array in JSON
                let channelsList = [];
                if (Array.isArray(rawData)) {
                    channelsList = rawData;
                } else if (typeof rawData === 'object' && rawData !== null) {
                    for (let key in rawData) {
                        if (Array.isArray(rawData[key])) { 
                            channelsList = rawData[key]; 
                            break; 
                        }
                    }
                }

                if (channelsList.length === 0) {
                    grid.innerHTML = '<div class="status-msg">JSON loaded, but could not parse a valid list of channels.</div>';
                    return;
                }

                // Parse Data & Clean URL
                allChannels = channelsList.map(channel => {
                    
                    // SMART URL CLEANER: Ensures it only goes up to .mpd
                    let rawUrl = channel["channel url"] || channel.channel_url || channel.url || "";
                    let cleanedUrl = rawUrl;
                    if (cleanedUrl.includes('.mpd')) {
                        cleanedUrl = cleanedUrl.substring(0, cleanedUrl.indexOf('.mpd') + 4);
                    } else if (cleanedUrl.includes('?')) {
                        cleanedUrl = cleanedUrl.split('?')[0];
                    }

                    return {
                        name: channel["channel name"] || channel.channel_name || channel.name || "Unknown Channel",
                        logo: channel["channel logo"] || channel.channel_logo || channel.logo || "https://via.placeholder.com/100?text=TV",
                        category: channel["channel category"] || channel.channel_category || channel.category || "Uncategorized",
                        url: cleanedUrl || "No URL Provided",
                        keyId: channel["channel key id"] || channel.channel_key_id || channel.keyId || "Null",
                        key: channel["channel key"] || channel.channel_key || channel.key || "Null",
                        cookie: channel["channel cookie"] || channel.channel_cookie || channel.cookie || "Null"
                    };
                });

                allChannels.sort((a, b) => a.name.localeCompare(b.name));
                
                populateCategories();
                applyFilters();

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="status-msg" style="color:#ef4444;">Error Loading Data.</div>`;
            }
        }

        // 2. Populate Categories WITH COUNTS
        function populateCategories() {
            const currentCat = catFilter.value;
            const counts = {};

            // Count how many channels are in each category
            allChannels.forEach(c => {
                counts[c.category] = (counts[c.category] || 0) + 1;
            });
            
            // Sort categories alphabetically
            const sortedCategories = Object.keys(counts).sort();
            
            // Build Dropdown HTML
            let html = `<option value="all">All Categories (${allChannels.length})</option>`;
            sortedCategories.forEach(cat => {
                 const isSelected = cat === currentCat ? 'selected' : '';
                 html += `<option value="${cat}" ${isSelected}>${cat} (${counts[cat]})</option>`;
            });
            
            catFilter.innerHTML = html;
        }

        // 3. Render Grid
        function renderGrid(channelsToRender) {
            grid.innerHTML = ''; 
            
            if (channelsToRender.length === 0) {
                grid.innerHTML = `<div class="status-msg">No channels found.</div>`;
                return;
            }

            channelsToRender.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(c);

                card.innerHTML = `
                    <img src="${c.logo}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/100?text=TV'">
                    <div class="card-title" title="${c.name}">${c.name}</div>
                    <div class="card-badge">${c.category}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. Handle Filters
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCat = catFilter.value;

            const filteredChannels = allChannels.filter(c => {
                const matchSearch = c.name.toLowerCase().includes(searchTerm);
                const matchCat = (selectedCat === "all") || (c.category === selectedCat);
                return matchSearch && matchCat;
            });

            renderGrid(filteredChannels);
        }

        // Event Listeners for Filters
        searchInput.addEventListener('input', applyFilters);
        catFilter.addEventListener('change', applyFilters);

        // 5. Modal Logic
        function openModal(c) {
            document.getElementById('modalImg').src = c.logo;
            document.getElementById('modalTitle').innerText = c.name;
            document.getElementById('modalCategory').innerText = c.category;
            
            document.getElementById('modalUrl').innerText = c.url;
            document.getElementById('modalKeyId').innerText = c.keyId;
            document.getElementById('modalKey').innerText = c.key;
            document.getElementById('modalCookie').innerText = c.cookie;

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Close when clicking outside the modal box
        modal.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initialize App
        loadChannels();
    </script>
</body>
</html>
