<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLiv Playlist Player</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #ffc107; 
        }
        #loading { 
            text-align: center; 
            font-size: 1.2rem; 
            color: #aaa; 
        }
        #playlist { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .channel-card { 
            background: #1e1e1e; 
            border-radius: 10px; 
            padding: 20px; 
            text-decoration: none; 
            color: white; 
            transition: all 0.2s ease-in-out; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            border: 1px solid #333; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .channel-card:hover { 
            transform: translateY(-5px); 
            border-color: #ffc107; 
            box-shadow: 0 6px 12px rgba(255, 193, 7, 0.2); 
        }
        .channel-logo { 
            max-width: 100%; 
            height: 120px; 
            margin-bottom: 15px; 
            object-fit: cover; 
            border-radius: 6px; 
        }
        .channel-title { 
            font-size: 16px; 
            font-weight: 600; 
            word-wrap: break-word; 
        }
        .error { 
            color: #ff4c4c; 
            text-align: center; 
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <h1>SonyLiv Live Events</h1>
    <div id="loading">Fetching live events...</div>
    <div id="playlist"></div>

    <script>
        const JSON_URL = 'https://raw.githubusercontent.com/drmlive/sliv-live-events/main/sonyliv.json';
        const PLAYER_BASE_URL = 'https://webplay.rf.gd/sonyliv-events/player.html?url=';

        async function loadPlaylist() {
            try {
                const response = await fetch(JSON_URL, { cache: "no-store" });
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                // Use the aggressive scanner that successfully found your link
                const validItems = extractPlayableItems(data);
                
                if (validItems.length === 0) {
                    document.getElementById('playlist').innerHTML = '<div class="error">No live events found in the file at the moment.</div>';
                    return;
                }

                buildCards(validItems);
            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('playlist').innerHTML = '<div class="error">Failed to load live events. Check your network connection.</div>';
            }
        }

        // The successful deep scanner logic
        function extractPlayableItems(obj) {
            let foundItems = [];
            
            if (Array.isArray(obj)) {
                obj.forEach(item => {
                    foundItems = foundItems.concat(extractPlayableItems(item));
                });
            } 
            else if (typeof obj === 'object' && obj !== null) {
                let streamUrl = obj.play_url || obj.url || obj.dash_url || obj.hls_url || obj.link || obj.file || obj.stream_url || obj.video;

                if (!streamUrl) {
                    for (let key in obj) {
                        const val = obj[key];
                        if (typeof val === 'string' && val.startsWith('http') && (val.includes('.m3u8') || val.includes('.mpd') || val.includes('akamaized'))) {
                            streamUrl = val;
                            break;
                        }
                    }
                }

                if (streamUrl && typeof streamUrl === 'string' && streamUrl.startsWith('http')) {
                    obj.extracted_url = streamUrl;
                    foundItems.push(obj);
                } else {
                    for (let key in obj) {
                        if (typeof obj[key] === 'object') {
                            foundItems = foundItems.concat(extractPlayableItems(obj[key]));
                        }
                    }
                }
            }
            return foundItems;
        }

        function buildCards(items) {
            const playlistContainer = document.getElementById('playlist');
            
            items.forEach((item, index) => {
                const streamUrl = item.extracted_url; 
                const currentName = item.title || item.event_name || item.match_name || item.name || item.id || `Live Event ${index + 1}`;
                let currentLogo = item.image || item.thumbnail || item.src || item.logo || '';
                
                if (!currentLogo) {
                     for (let key in item) {
                        if (typeof item[key] === 'string' && (item[key].endsWith('.png') || item[key].endsWith('.jpg') || item[key].includes('images'))) {
                            currentLogo = item[key];
                            break;
                        }
                    }
                }

                const finalPlayerUrl = `${PLAYER_BASE_URL}${encodeURIComponent(streamUrl)}`;

                const card = document.createElement('a');
                card.className = 'channel-card';
                card.href = finalPlayerUrl;
                card.target = '_blank';

                if (currentLogo) {
                    const img = document.createElement('img');
                    img.src = currentLogo;
                    img.alt = currentName;
                    img.className = 'channel-logo';
                    img.onerror = function() { this.style.display = 'none'; };
                    card.appendChild(img);
                }

                const title = document.createElement('div');
                title.className = 'channel-title';
                title.textContent = currentName;
                card.appendChild(title);

                playlistContainer.appendChild(card);
            });
        }

        loadPlaylist();
    </script>
</body>
</html>
