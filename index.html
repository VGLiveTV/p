<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JioTV Player</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* Hide Shaka loading spinner completely */
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 100;
    }
    .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff4444;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading">Loading Channel...</div>
  <div id="error" class="error" style="display:none"></div>

  <div data-shaka-player-container="" shaka-controls="true" class="shaka-video-container" style="cursor: none;">
    <div class="shaka-video-container shaka-video" data-shaka-player="">
      <video autoplay playsinline class="shaka-video"></video>
    </div>
    <canvas class="shaka-canvas-container"></canvas>
  </div>

  <script>
    const API = "https://pkll.xojiv79335.workers.dev/";

    function getId() {
      return new URLSearchParams(location.search).get("id");
    }

    async function fetchChannel() {
      const id = getId();
      if (!id) {
        showError("Channel ID missing");
        return null;
      }
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error("API request failed");
        const data = await res.json();
        return data.find(c => c.channel_id == id);
      } catch (err) {
        showError("Failed to fetch channel list");
        return null;
      }
    }

    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      const err = document.getElementById("error");
      err.innerText = msg;
      err.style.display = "block";
    }

    async function startPlayer(channel) {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        showError("Browser not supported for Shaka Player");
        return;
      }

      const video = document.querySelector("video");
      const player = new shaka.Player(video);
      const container = document.querySelector(".shaka-video-container");

      // Attach UI controls
      new shaka.ui.Overlay(player, container, video);

      // Configuration (optimized for live/low-latency)
      player.configure({
        drm: {
          clearKeys: {
            [channel.keyId]: channel.key
          }
        },
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 30,
          rebufferingGoal: 2,
          bufferBehind: 30,
          inaccurateManifestTolerance: 2,
          retryParameters: {
            timeout: 12000,
            maxAttempts: 5,
            baseDelay: 300,
            backoffFactor: 1.2
          },
          segmentRequestTimeout: 10000,
          segmentPrefetchLimit: 3,
          stallEnabled: false,
          useNativeHlsOnSafari: true
        },
        manifest: {
          retryParameters: {
            timeout: 8000,
            maxAttempts: 3
          }
        }
      });

      // Network request modifications
      const cookie = channel.cookie;
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers["Referer"] = "https://www.jiotv.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        
        if (cookie) {
          request.headers["Cookie"] = cookie;
        }

        // Append cookie token to segments/manifest if missing
        if (cookie && (type === shaka.net.NetworkingEngine.RequestType.SEGMENT ||
                       type === shaka.net.NetworkingEngine.RequestType.MANIFEST)) {
          if (!request.uris[0].includes("__hdnea__")) {
            const sep = request.uris[0].includes("?") ? "&" : "?";
            request.uris[0] += sep + cookie;
          }
        }
      });

      try {
        await player.load(channel.channel_url);
        document.getElementById("loading").style.display = "none";
        video.play().catch(e => console.warn("Autoplay prevented:", e));
      } catch (e) {
        console.error("Player load error:", e);
        showError("Stream failed to start");
      }
    }

    async function init() {
      const channel = await fetchChannel();
      if (!channel) {
        return; // error already shown
      }

      // No logo/name setting anymore

      await startPlayer(channel);
    }

    init();
  </script>
</body>
</html>
