<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VG TV Dashboard</title>
<link rel="icon" id="favicon" href="https://raw.githubusercontent.com/VGLive/tv/refs/heads/main/fav.png">
<meta name="referrer" content="no-referrer">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" />

<style>
    /* --- Universal Resets --- */
    * { margin:0; padding:0; box-sizing:border-box; }
    
    html, body {
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
    }

    /* --- Dashboard Styles --- */
    #dashboard-view {
        padding: 30px;
        min-height: 100%;
        overflow-y: auto;
    }
    
    h1 { 
        margin-bottom: 30px; 
        color: #38bdf8;
        text-align: center;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 25px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .card {
        background: #1e293b;
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,.4);
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
        border: 2px solid transparent;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .card:hover {
        transform: translateY(-8px);
        border-color: #38bdf8;
    }

    .card img {
        width: 100%;
        height: 120px;
        object-fit: contain;
        background: #0b0f19;
        border-radius: 10px;
        margin-bottom: 15px;
        padding: 10px;
    }

    .card h2 {
        color: #f1f5f9;
        font-size: 16px;
        font-weight: 600;
    }

    /* --- Player Styles --- */
    #player-view {
        display: none; 
        width: 100%;
        height: 100%;
        background: #000;
        position: fixed;
        top: 0;
        left: 0;
    }

    .shaka-video-container {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }

    .custom-watermark {
        position: absolute;
        z-index: 40;
        pointer-events: none;
        top: 65%;
        left: 6%;
        transform: translateY(-50%);
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.12);
    }

    .loading-msg {
        position: absolute;
        color: white;
        font-size: 18px;
        z-index: 50;
    }

    @media(max-width: 700px){
        .custom-watermark { font-size: 9px; top: 60%; left: 16%; }
    }
</style>
</head>
<body>

<div id="dashboard-view">
    <h1>Live Channels</h1>
    <div class="container" id="channels">
        <p style="grid-column: 1/-1; text-align: center;">Loading channels...</p>
    </div>
</div>

<div id="player-view">
    <div class="shaka-video-container" id="player-container">
        <div class="loading-msg" id="loadingMsg">Connecting to secure stream...</div>
        <video id="video" autoplay playsinline preload="metadata"></video>
        <div class="custom-watermark"></div>
    </div>
</div>

<script>
    const JSON_URL = "https://binge-giotv.pages.dev/data/id.json";

    document.addEventListener('DOMContentLoaded', async () => {
        // Check URL for an ID parameter (e.g., ?id=StarSports)
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('id');

        if (channelId) {
            // If ID exists in URL, we are in the NEW TAB -> Launch Player
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            await initPlayer(channelId);
        } else {
            // If no ID, we are on the MAIN PAGE -> Show Dashboard
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('player-view').style.display = 'none';
            await initDashboard();
        }
    });

    // ==========================================
    // 1. DASHBOARD LOGIC (Main Page)
    // ==========================================
    async function initDashboard() {
        try {
            const res = await fetch(JSON_URL, { cache: "no-store" });
            const data = await res.json();
            
            // Extract channels
            const channels = data.channels || (Array.isArray(data) ? data : Object.values(data));
            
            let html = "";
            channels.forEach((channel) => {
                const title = channel.name || channel.title;
                // Target="_blank" forces it to open in a new tab
                html += `
                <a href="?id=${encodeURIComponent(title)}" target="_blank" class="card">
                    <img src="${channel.logo}" alt="${title}" onerror="this.src='https://ui-avatars.com/api/?name=TV&background=0b0f19&color=fff'">
                    <h2>${title}</h2>
                </a>
                `;
            });
            document.getElementById("channels").innerHTML = html;
        } catch (err) {
            document.getElementById("channels").innerHTML = `<p style="color:red; text-align:center;">Failed to load JSON database.</p>`;
        }
    }

    // ==========================================
    // 2. PLAYER LOGIC (New Tab)
    // ==========================================
    async function initPlayer(targetName) {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            document.getElementById('loadingMsg').innerText = "Browser not supported.";
            return;
        }

        const videoEl = document.getElementById('video');
        const container = document.getElementById('player-container');
        const loadingMsg = document.getElementById('loadingMsg');

        // Fetch JSON to find the hidden credentials for this specific channel
        let channel = null;
        try {
            const res = await fetch(JSON_URL, { cache: "no-store" });
            const data = await res.json();
            const allChannels = data.channels || (Array.isArray(data) ? data : Object.values(data));
            
            // Find the exact channel by name
            channel = allChannels.find(c => (c.name || c.title) === targetName);
        } catch (e) {
            loadingMsg.innerText = "Error fetching secure credentials.";
            return;
        }

        if (!channel) {
            loadingMsg.innerText = "Channel not found in database.";
            return;
        }

        // Update Page Title and Favicon
        document.title = channel.name || channel.title;
        if (channel.logo) document.getElementById('favicon').href = channel.logo;

        // Extract sensitive data
        const streamUrl = channel.url || channel.streamUrl || "";
        const kid = channel.keyId || channel.kid || "";
        const key = channel.key || channel.k || "";
        const cookieHeader = channel.cookie || channel.cookieHeader || "";

        const player = new shaka.Player(videoEl);
        const ui = new shaka.ui.Overlay(player, container, videoEl);

        ui.configure({
            addBigPlayButton: true,
            addSeekBar: false,
            controlPanelElements: ['play_pause','time_and_duration','mute','volume','spacer','fullscreen','overflow_menu'],
            seekBarColors: { base: 'white', buffered: 'red', played: 'green' }
        });

        // Apply Widevine Keys
        let drmConfig = { clearKeys: {} };
        if (kid && key && kid !== "Null" && key !== "Null") {
            drmConfig.clearKeys[kid] = key;
        }

        player.configure({
            drm: drmConfig,
            manifest: { defaultPresentationDelay: 5 },
            streaming: { safeSeekOffset: 5, bufferingGoal: 10, rebufferingGoal: 2, lowLatencyMode: true }
        });

        // Apply Jio Authentication Filters
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['Referer'] = 'https://www.jiotv.com/';
            request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';

            if (cookieHeader && cookieHeader !== "PUT_YOUR_COOKIE_HERE" && cookieHeader !== "N/A") {
                request.headers['Cookie'] = cookieHeader;

                if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                     type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
                     !request.uris[0].includes('__hdnea__')) {
                    const sep = request.uris[0].includes('?') ? '&' : '?';
                    let urlCookie = cookieHeader.startsWith("__hdnea__=") ? cookieHeader.substring(10) : cookieHeader;
                    request.uris[0] += sep + "__hdnea__=" + urlCookie;
                }
            }
        });

        // Start Stream
        try {
            await player.load(streamUrl);
            loadingMsg.style.display = "none"; // Hide loading text
            videoEl.play();
        } catch (e) {
            console.error("Stream Load Error:", e);
            if (e.code === 6001) { 
                player.configure({ drm: {} });
                try { 
                    await player.load(streamUrl); 
                    loadingMsg.style.display = "none";
                    videoEl.play(); 
                } catch(err){
                    loadingMsg.innerText = "Stream failed to decrypt.";
                }
            } else {
                loadingMsg.innerText = "Stream playback failed.";
            }
        }
    }
</script>
</body>
</html>
