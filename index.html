<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JioTV Channels</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1f2937;
    border-radius:15px;
    padding:15px;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:130px;
    object-fit:contain;
    background:white;
    border-radius:10px;
}

.card h3{
    margin-top:15px;
    text-align:center;
}

#playerPage{
    display:none;
    width:100vw;
    height:100vh;
}

.shaka-video-container{
    width:100%;
    height:100%;
    background:black;
}

video{
    width:100%;
    height:100%;
}
</style>
</head>
<body>

<div id="homePage">
    <div class="grid" id="channels"></div>
</div>

<div id="playerPage">
    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay playsinline></video>
    </div>
</div>

<script>

const params = new URLSearchParams(window.location.search);

if(params.get("url")){

    document.getElementById("homePage").style.display="none";
    document.getElementById("playerPage").style.display="block";

    shaka.polyfill.installAll();

    if(shaka.Player.isBrowserSupported()){

        const video = document.getElementById("video");
        const container = document.getElementById("player-container");

        const player = new shaka.Player(video);
        new shaka.ui.Overlay(player, container, video);

        const kid = params.get("kid") || "Null";
        const key = params.get("key") || "Null";
        const cookieHeader = params.get("cookie") || "";
        const streamUrl = params.get("url");

        let drmConfig = {
            clearKeys: {}
        };

        if(kid !== "Null" && key !== "Null"){
            drmConfig.clearKeys[kid] = key;
        }

        player.configure({
            drm: drmConfig
        });

        player.getNetworkingEngine().registerRequestFilter((type, request)=>{

            request.headers["Referer"] = "https://www.jiotv.com/";
            request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

            if(cookieHeader){
                request.headers["Cookie"] = cookieHeader;
            }

        });

        player.load(streamUrl)
            .then(()=>video.play())
            .catch(console.error);
    }

}
else{

    fetch("https://binge-giotv.pages.dev/data/id.json")
    .then(r=>r.json())
    .then(data=>{

        console.log(data);

        let channels;

        if(Array.isArray(data)){
            channels = data;
        }
        else if(data.channels){
            channels = data.channels;
        }
        else if(data.data){
            channels = data.data;
        }
        else{
            channels = Object.values(data);
        }

        let html = "";

        channels.forEach(channel=>{

            const qs = new URLSearchParams({
                name: channel.name || "",
                url: channel.url || "",
                cookie: channel.cookie || "",
                kid: channel.keyid || "",
                key: channel.key || ""
            });

            html += `
            <div class="card"
            onclick="window.open(location.pathname + '?' + '${qs}', '_blank')">

                <img src="${channel.logo}">
                <h3>${channel.name}</h3>

            </div>
            `;
        });

        document.getElementById("channels").innerHTML = html;

    })
    .catch(err=>{
        console.log(err);
        document.getElementById("channels").innerHTML =
        "<h2 style='padding:20px'>Failed to load channels</h2>";
    });

}

</script>

</body>
</html>
