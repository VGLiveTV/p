<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>JioTv+ Player</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.20/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.20/dist/controls.css"/>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            color: var(--text-main);
            overflow-x: hidden; 
        }
        
        body.modal-open { overflow: hidden; } /* Prevents background scrolling when video is playing */

        .app { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 1rem; margin-bottom: 2rem; padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }

        .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: white;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .logo-text h1 {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .search-wrapper {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 16px; padding: 0.5rem 1rem; border: 1px solid var(--card-border);
            width: min(320px, 100%); backdrop-filter: blur(10px);
        }
        
        .search-wrapper input {
            background: transparent; border: none; outline: none;
            width: 100%; color: white; padding-left: 10px;
        }

        /* Grid */
        .channel-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.2rem;
        }

        .channel-card {
            background: var(--card-bg); border-radius: 20px; padding: 1rem 0.5rem;
            border: 1px solid var(--card-border); position: relative;
            cursor: pointer; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .channel-card:hover { 
            transform: translateY(-5px); 
            background: rgba(30, 41, 59, 0.9); 
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card-logo {
            width: 80px; height: 80px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.6); border-radius: 18px; padding: 8px;
        }
        
        .card-logo img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

        .card-name { font-weight: 600; font-size: 0.85rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }

        /* Video Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px);
        }
        
        .modal-overlay.show { display: flex; flex-direction: column; }
        
        .modal-header {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: absolute; top: 0; left: 0; z-index: 1010;
        }

        #modalChannelName { font-size: 1.2rem; font-weight: 700; color: #fff; }

        #closeModalBtn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        
        #closeModalBtn:hover { background: #ef4444; border-color: #ef4444; }

        /* Shaka Player Container inside Modal */
        .shaka-video-container {
            width: 100%; max-width: 1200px; height: 80vh; 
            max-height: 800px; background: #000; display: flex;
            align-items: center; justify-content: center; position: relative;
        }
        
        .shaka-video-container video {
            width: 100%; height: 100%; object-fit: contain; background: #000;
        }

        .empty-box { grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted); }

        @media (max-width: 600px) {
            .header-actions { width: 100%; justify-content: space-between; margin-top: 10px; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .card-logo { width: 60px; height: 60px; }
            .shaka-video-container { height: 100vh; max-height: none; } /* Full screen on mobile */
            .modal-header { padding: 1rem; }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tv"></i></div>
            <div class="logo-text"><h1>JioTV+</h1></div>
        </div>
        <div class="header-actions">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search channels...">
            </div>
        </div>
    </header>
    
    <div id="channelGrid" class="channel-grid"></div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-header">
            <div id="modalChannelName">Channel</div>
            <button id="closeModalBtn"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="shaka-video-container" id="player-container">
            <video id="video" autoplay muted playsinline preload="metadata"></video>
        </div>
    </div>
</div>

<script>
    (function(){
        let allChannels = [];
        let currentPlayer = null;

        // DOM Elements
        const grid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const videoElement = document.getElementById('video');
        const containerElement = document.getElementById('player-container');

        // Ensure Shaka polyfills are installed
        shaka.polyfill.installAll();

        // 1. Fetch and Parse JSON Data
        async function loadData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/vaathala00/jo/main/stream.json');
                const rawData = await res.json();
                
                // Aggressive Array Extraction
                if (Array.isArray(rawData)) {
                    allChannels = rawData;
                } else if (typeof rawData === 'object' && rawData !== null) {
                    // Try common keys
                    allChannels = rawData.channels || rawData.data || rawData.streams || rawData.results || [];
                    // Fallback: Find the first array in the object
                    if (allChannels.length === 0) {
                        for (let key in rawData) {
                            if (Array.isArray(rawData[key])) {
                                allChannels = rawData[key];
                                break;
                            }
                        }
                    }
                }
                
                // If it's just a single object instead of an array, wrap it
                if (allChannels.length === 0 && !Array.isArray(rawData) && Object.keys(rawData).length > 0) {
                     allChannels = [rawData];
                }

                filterAndRender();
            } catch (e) { 
                grid.innerHTML = `<div class="empty-box">Failed to load channels. Check internet connection.</div>`; 
                console.error("Fetch Error:", e);
            }
        }

        // 2. Render Grid and Handle Search
        function filterAndRender() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = allChannels;

            if (query) {
                filtered = allChannels.filter(ch => {
                    const cName = ch["channel name"] || ch.name || ch.title || ch.channel_name || '';
                    return String(cName).toLowerCase().includes(query);
                });
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-box">No channels found. Please check if stream.json is formatted correctly.</div>';
                return;
            }

            grid.innerHTML = filtered.map(ch => {
                // Property mapping specifically targeting your JSON format
                const cName = ch["channel name"] || ch.name || ch.title || ch.channel_name || 'Unknown Channel';
                const cLogo = ch["channel logo"] || ch.logo || ch.image || ch.channel_logo || 'https://via.placeholder.com/80';
                const cUrl = ch["channel url"] || ch.url || ch.link || ch.stream_url || '';
                const cKeyId = ch["channel key id"] || ch["key id"] || ch.key_id || ch.keyId || '';
                const cKey = ch["channel key"] || ch.key || ch.channel_key || '';
                const cCookie = ch["channel cookie"] || ch.cookie || ch.channel_cookie || '';
                
                const safeName = String(cName).replace(/'/g, "\\'");
                
                return `
                <div class="channel-card" onclick="openAndPlay('${safeName}', '${cUrl}', '${cKeyId}', '${cKey}', '${cCookie}')">
                    <div class="card-logo"><img src="${cLogo}" loading="lazy" alt="logo" onerror="this.src='https://via.placeholder.com/80'"></div>
                    <div class="card-name">${cName}</div>
                </div>
            `}).join('');
        }

        // 3. Shaka Player Initialization & Playback Logic
        window.openAndPlay = async (name, url, keyId, key, cookie) => {
            if (!shaka.Player.isBrowserSupported()) {
                alert("Your browser does not support Shaka Player.");
                return;
            }

            // Prepare Modal UI
            document.getElementById('modalChannelName').textContent = name;
            modalOverlay.classList.add('show');
            document.body.classList.add('modal-open');
            videoElement.muted = true; // start muted for autoplay policy

            // Initialize Player
            currentPlayer = new shaka.Player();
            await currentPlayer.attach(videoElement);
            
            // Initialize UI Overlay
            const ui = new shaka.ui.Overlay(currentPlayer, containerElement, videoElement);
            ui.configure({
                addBigPlayButton: true,
                controlPanelElements: [  
                    'play_pause', 'time_and_duration', 'mute', 'volume',  
                    'spacer', 'language', 'picture_in_picture',  
                    'quality', 'fullscreen'  
                ],  
                seekBarColors: { base: 'white', buffered: 'red', played: '#38bdf8' }
            });  

            // Player Configuration (DRM + Buffering limits)
            let playerConfig = {
                manifest: { defaultPresentationDelay: 5 },
                streaming: { lowLatencyMode: true, bufferingGoal: 10, rebufferingGoal: 2, safeSeekOffset: 5 }
            };

            // Inject ClearKey DRM if available
            if (keyId && key) {
                playerConfig.drm = { clearKeys: { [keyId]: key } };
            }
            currentPlayer.configure(playerConfig);

            // Inject Auth Cookie Filter if available
            if (cookie) {
                let urlCookie = cookie.startsWith("__hdnea__=") ? cookie.substring(10) : cookie;
                currentPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                    if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                         type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
                        !request.uris[0].includes("__hdnea__")) {
                        const sep = request.uris[0].includes("?") ? "&" : "?";
                        request.uris[0] += sep + "__hdnea__=" + urlCookie;
                    }
                });
            }

            // Load and Play
            try {
                await currentPlayer.load(url);
                videoElement.play().catch(()=>{});
            } catch(e) {
                console.error("Error loading stream:", e);
                alert("Failed to play the stream.");
            }

            // Unmute once playing successfully starts
            videoElement.addEventListener("play", () => {
                videoElement.muted = false;
            }, { once: true });
        };

        // 4. Destroy Player & Close Modal
        function closePlayer() {
            modalOverlay.classList.remove('show');
            document.body.classList.remove('modal-open');
            
            if (currentPlayer) {
                currentPlayer.unload();
                currentPlayer.destroy();
                currentPlayer = null;
            }
            
            // Clean up dynamically injected UI Overlay elements
            const uiContainers = document.querySelectorAll('.shaka-ui-overlay');
            uiContainers.forEach(container => container.remove());
        }

        // Event Listeners for Closing
        document.getElementById('closeModalBtn').onclick = closePlayer;
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closePlayer();
        });

        // 5. Search Debounce
        let searchTimer;
        searchInput.oninput = () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterAndRender, 300);
        };

        // Initialize App
        loadData();
    })();
</script>
</body>
</html>
