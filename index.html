<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live News</title>
<link rel="icon" href="https://i.ibb.co/ch66mWzw/live-news.png">
<meta name="referrer" content="no-referrer">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#000;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .dashboard-container{padding:20px 15px;max-width:1200px;margin:0 auto}
  .dashboard-logo{display:block;margin:0 auto 25px auto;height:60px;object-fit:contain}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:15px}
  .card{width:135px;background:#fff;border:2px solid red;border-radius:10px;padding:15px 10px;cursor:pointer;text-align:center;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .card:hover{background:#fcfcfc;border-color:#c00;transform:translateY(-4px);box-shadow:0 6px 12px rgba(0,0,0,.12)}
  .card img{max-width:100%;height:45px;object-fit:contain;margin-bottom:12px}
  .card-title{font-size:13px;font-weight:600;line-height:1.3;color:#333}
  @media(min-width:768px){
    .dashboard-container{padding:40px 30px}
    .dashboard-logo{margin-bottom:35px;height:75px}
    .grid{gap:20px}
    .card{width:160px;padding:20px 15px}
    .card img{height:55px}
    .card-title{font-size:14px}
  }
</style>
</head>
<body>

<div class="dashboard-container">
  <img src="https://i.ibb.co/hJvZJ21n/live.png" alt="Live News" class="dashboard-logo">
  <div class="grid" id="channel-grid"></div>
</div>

<script>
(function(){
  const channels = [
    { name: "Aaj Tak", url: "https://feeds.intoday.in/aajtak/api/aajtakhd/master.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/Aaj_Tak.png" },
    { name: "ABP News", url: "https://d2l4ar6y3mrs4k.cloudfront.net/live-streaming/abpnews-livetv/master.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/ABP_News_India.png" },
    { name: "CNBC Awaaz", url: "https://n18syndication.akamaized.net/bpk-tv/CNBC_Awaaz_NW18_MOB/output01/master.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/CNBC_Awaaz.png" },
    { name: "DD News", url: "https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/0811cd8c37ca4c409d5385a6cd2fa18b/index.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/DD_News.png" },
    { name: "India TV", url: "https://pl-indiatvnews.akamaized.net/out/v1/db79179b608641ceaa5a4d0dd0dca8da/index.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/India_TV.png" },
    { name: "News Nation", url: "https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/6cd2f649739a45ca9de1daf81cc7d0f2/index.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/News_Nation.png" },
    { name: "Republic Bharat", url: "https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/RepublicBharat.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/Republic_Bharat.png" },
    { name: "TV9 Bharatvarsh", url: "https://dyjmyiv3bp2ez.cloudfront.net/pub-iotv9hinjzgtpe/liveabr/playlist.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/TV9_Bharatvarsh.png" },
    { name: "Zee Business", url: "https://dwby15d04agvq.cloudfront.net/index_5.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/Zee_Business.png" },
    { name: "Zee News", url: "https://dknttpxmr0dwf.cloudfront.net/index_57.m3u8", logo: "https://jiotv.catchup.cdn.jio.com/dare_images/images/Zee_News.png" }
  ];

  document.addEventListener("DOMContentLoaded", () => {
    const grid = document.getElementById("channel-grid");
    channels.forEach(ch => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<img src="${ch.logo}" alt="${ch.name}"><div class="card-title">${ch.name}</div>`;
      card.onclick = () => openPlayerInNewTab(ch.name, ch.url, ch.logo);
      grid.appendChild(card);
    });
  });

  function openPlayerInNewTab(title, streamUrl, logoUrl) {
    const newTab = window.open('about:blank', '_blank');
    newTab.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title}</title>
<link rel="icon" href="https://i.ibb.co/ch66mWzw/live-news.png">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"><\/script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css"/>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.shaka-video-container{position:fixed;inset:0}
video{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="shaka-video-container" id="c"><video id="v" autoplay muted playsinline preload="metadata"></video></div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) return;
  const v = document.getElementById("v"), c = document.getElementById("c");
  const p = new shaka.Player(v), ui = new shaka.ui.Overlay(p, c, v);
  ui.configure({addBigPlayButton:true,addSeekBar:false,controlPanelElements:['play_pause','time_and_duration','mute','volume','spacer','overflow_menu','fullscreen']});
  p.configure({manifest:{defaultPresentationDelay:5},streaming:{lowLatencyMode:true,bufferingGoal:10,rebufferingGoal:2,safeSeekOffset:5}});
  try { await p.load("${streamUrl}"); v.play().catch(()=>{}); } catch(e) { console.error(e); }
});
<\/script>
</body>
</html>`);
    newTab.document.close();
  }
})();
</script>
</body>
</html>
