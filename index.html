<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTv+ Player</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            color: var(--text-main);
        }

        .app { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 0 1rem 1.5rem 1rem; 
        }

        /* Header (Frozen/Sticky) */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 1rem; padding: 1rem 0; margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

        .logo-icon {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: var(--accent-color);
            transition: 0.3s;
        }

        .logo-text h1 {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }

        .channel-count {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted); 
            background: none;
            margin-top: 2px;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }

        /* Custom Dropdown Styling */
        .custom-filter {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 0.5rem 2.2rem 0.5rem 0.8rem;
            outline: none;
            backdrop-filter: blur(10px);
            cursor: pointer;
            font-size: 0.9rem;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 1em;
            transition: 0.3s;
            max-width: 140px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .custom-filter:focus { border-color: var(--accent-color); }
        .custom-filter option { background: var(--bg-color); color: var(--text-main); }

        .search-wrapper {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 16px; padding: 0.5rem 1rem; border: 1px solid var(--card-border);
            max-width: 250px; backdrop-filter: blur(10px); flex: 1;
        }
        
        .search-wrapper input {
            background: transparent; border: none; outline: none;
            width: 100%; color: white; padding-right: 8px; min-width: 0;
        }

        .search-wrapper i { color: var(--text-muted); }

        /* Grid */
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.2rem; }

        .channel-card {
            background: var(--card-bg); border-radius: 20px; padding: 1rem 0.5rem;
            border: 1px solid var(--card-border); position: relative;
            cursor: pointer; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .channel-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.9); border-color: rgba(56, 189, 248, 0.4);}

        .card-logo {
            width: 80px; height: 80px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.6); border-radius: 18px; padding: 8px;
        }
        
        .card-logo img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

        .card-name { font-weight: 600; font-size: 0.85rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }

        .empty-box { grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted); }

        /* Mobile Adjustments */
        @media (max-width: 650px) {
            .app { padding: 0 0.5rem 1.5rem 0.5rem; }
            .header { flex-wrap: nowrap; gap: 6px; padding: 0.8rem 0; }
            .logo-area { gap: 6px; }
            .logo-icon { width: 30px; height: 30px; font-size: 1.2rem; }
            .logo-text h1 { font-size: 1.1rem; }
            
            .header-actions { gap: 4px; }
            
            /* Extreme compression to fit 2 dropdowns + search on one line */
            .custom-filter {
                padding: 0.4rem 1.4rem 0.4rem 0.4rem;
                font-size: 0.75rem;
                max-width: 65px; 
                background-position: right 4px center;
                background-size: 0.8em;
                border-radius: 10px;
            }
            .search-wrapper {
                padding: 0.4rem 0.6rem;
                border-radius: 10px;
            }
            .search-wrapper input { font-size: 0.8rem; }
            
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.8rem; }
            .card-logo { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tv"></i></div>
            <div class="logo-text">
                <h1>JioTV+ <span id="channelCount" class="channel-count"></span></h1>
            </div>
        </div>
        <div class="header-actions">
            <select id="catFilter" class="custom-filter">
                <option value="All">Cat</option>
            </select>
            
            <select id="langFilter" class="custom-filter">
                <option value="All">Lang</option>
            </select>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>
    
    <div id="channelGrid" class="channel-grid"></div>
</div>

<script>
    (function(){
        let allChannels = [];

        const grid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const countDisplay = document.getElementById('channelCount');
        const langFilter = document.getElementById('langFilter');
        const catFilter = document.getElementById('catFilter');

        async function loadData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/vaathala00/jow/main/output.json');
                allChannels = await res.json();
                
                // 1. Sort channels alphabetically by name
                allChannels.sort((a, b) => {
                    const nameA = a.name ? a.name.toLowerCase() : '';
                    const nameB = b.name ? b.name.toLowerCase() : '';
                    return nameA.localeCompare(nameB);
                });

                // 2. Extract unique languages and categories, then populate dropdowns
                populateFilters();

                filterAndRender();
            } catch (e) { 
                grid.innerHTML = `<div class="empty-box">Failed to load channels. Check connection.</div>`; 
            }
        }

        function populateFilters() {
            const languages = new Set();
            const categories = new Set();
            
            allChannels.forEach(ch => {
                // Check common language keys
                const lang = ch.language || ch.lang || ch.Language;
                if (lang && lang.trim() !== "") languages.add(lang.trim());

                // Check common category/group keys
                const cat = ch.category || ch.group || ch.group_title || ch['group-title'] || ch.Category;
                if (cat && cat.trim() !== "") categories.add(cat.trim());
            });

            // Populate Languages
            const sortedLangs = Array.from(languages).sort();
            let langHtml = '<option value="All">Lang</option>';
            sortedLangs.forEach(lang => langHtml += `<option value="${lang}">${lang}</option>`);
            langFilter.innerHTML = langHtml;

            // Populate Categories
            const sortedCats = Array.from(categories).sort();
            let catHtml = '<option value="All">Cat</option>';
            sortedCats.forEach(cat => catHtml += `<option value="${cat}">${cat}</option>`);
            catFilter.innerHTML = catHtml;
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedLang = langFilter.value;
            const selectedCat = catFilter.value;
            let filtered = allChannels;

            filtered = filtered.filter(ch => {
                // Match Search
                const matchesSearch = ch.name && ch.name.toLowerCase().includes(query);
                
                // Match Language
                const chLang = ch.language || ch.lang || ch.Language || '';
                const matchesLang = (selectedLang === 'All') || (chLang === selectedLang);

                // Match Category
                const chCat = ch.category || ch.group || ch.group_title || ch['group-title'] || ch.Category || '';
                const matchesCat = (selectedCat === 'All') || (chCat === selectedCat);

                return matchesSearch && matchesLang && matchesCat;
            });

            // Update channel count
            countDisplay.textContent = `(${filtered.length})`;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-box">No channels found.</div>';
                return;
            }

            grid.innerHTML = filtered.map(ch => {
                return `
                <div class="channel-card" onclick="window.open('${ch.link}', '_blank')">
                    <div class="card-logo"><img src="${ch.logo || 'https://via.placeholder.com/80'}" loading="lazy" alt="logo"></div>
                    <div class="card-name">${ch.name}</div>
                </div>
            `}).join('');
        }

        // Event Listeners
        let searchTimer;
        searchInput.oninput = () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterAndRender, 300);
        };

        langFilter.addEventListener('change', filterAndRender);
        catFilter.addEventListener('change', filterAndRender);

        loadData();
    })();
</script>
</body>
</html>
