<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLiv Playlist Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffc107;
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #aaa;
        }
        #playlist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #ffc107;
            box-shadow: 0 6px 12px rgba(255, 193, 7, 0.2);
        }
        .channel-logo {
            max-width: 100%;
            height: 120px;
            margin-bottom: 15px;
            object-fit: cover;
            border-radius: 6px;
        }
        .channel-title {
            font-size: 16px;
            font-weight: 600;
            word-wrap: break-word;
        }
        .error {
            color: #ff4c4c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SonyLiv Live Events</h1>
    <div id="loading">Fetching playlist...</div>
    <div id="playlist"></div>

    <script>
        // Updated to the requested JSON URL
        const JSON_URL = 'https://raw.githubusercontent.com/drmlive/sliv-live-events/refs/heads/main/sonyliv.json';
        const PLAYER_BASE_URL = 'https://webplay.rf.gd/sonyliv-events/player.html?url=';

        async function loadPlaylist() {
            try {
                const response = await fetch(JSON_URL, { cache: "no-store" });
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                parseJSON(data);
            } catch (error) {
                console.error('Error fetching playlist:', error);
                document.getElementById('loading').innerHTML = '<span class="error">Failed to load JSON playlist. Please check your internet connection or URL.</span>';
            }
        }

        function parseJSON(data) {
            const playlistContainer = document.getElementById('playlist');
            
            // Handle different JSON structures (usually an array, or an object containing a 'matches' array)
            const items = data.matches || (Array.isArray(data) ? data : []);

            if (items.length === 0) {
                playlistContainer.innerHTML = '<div class="error" style="grid-column: 1 / -1;">No playable links found in the JSON file.</div>';
                return;
            }

            items.forEach(item => {
                // Safely extract data, accounting for different possible key names in the JSON
                const streamUrl = item.play_url || item.url || item.dash_url || item.hls_url;
                const currentName = item.title || item.event_name || item.match_name || 'Unknown Event';
                const currentLogo = item.image || item.thumbnail || item.src || '';

                // Only create a card if a valid URL exists
                if (streamUrl) {
                    const finalPlayerUrl = `${PLAYER_BASE_URL}${streamUrl}`;

                    // Create the clickable card
                    const card = document.createElement('a');
                    card.className = 'channel-card';
                    card.href = finalPlayerUrl;
                    card.target = '_blank'; // Opens in new tab

                    // Add Logo (if exists)
                    if (currentLogo) {
                        const img = document.createElement('img');
                        img.src = currentLogo;
                        img.alt = currentName;
                        img.className = 'channel-logo';
                        // Fallback in case image breaks
                        img.onerror = function() { this.style.display = 'none'; };
                        card.appendChild(img);
                    }

                    // Add Title
                    const title = document.createElement('div');
                    title.className = 'channel-title';
                    title.textContent = currentName;
                    card.appendChild(title);

                    // Append card to grid
                    playlistContainer.appendChild(card);
                }
            });
        }

        // Initialize script
        loadPlaylist();
    </script>
</body>
</html>
