<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTv+ Player</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            color: var(--text-main);
        }

        .app { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 1rem; margin-bottom: 2rem; padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }

        .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: white;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .logo-text h1 {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .search-wrapper {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 16px; padding: 0.5rem 1rem; border: 1px solid var(--card-border);
            width: min(320px, 100%); backdrop-filter: blur(10px);
        }
        
        .search-wrapper input {
            background: transparent; border: none; outline: none;
            width: 100%; color: white; padding-left: 10px;
        }

        /* Grid */
        .channel-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.2rem;
        }

        .channel-card {
            background: var(--card-bg); border-radius: 20px; padding: 1rem 0.5rem;
            border: 1px solid var(--card-border); position: relative;
            cursor: pointer; text-align: center; transition: 0.3s;
        }
        
        .channel-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.9); border-color: rgba(56, 189, 248, 0.4);}

        .card-logo {
            width: 80px; height: 80px; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.6); border-radius: 18px; padding: 8px;
        }
        
        .card-logo img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

        .card-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .hd-badge { background: linear-gradient(135deg, #ec4899, #8b5cf6); font-size: 0.6rem; padding: 2px 8px; border-radius: 6px; color: white; font-weight: 700; display: inline-block;}

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px);
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal-card {
            background: #1e293b; width: 90%; max-width: 400px; border-radius: 24px;
            padding: 2rem; border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }

        .play-btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 1rem; background: var(--accent-color); color: #0f172a;
            border-radius: 16px; font-weight: 700; text-decoration: none; gap: 10px;
        }

        .empty-box { grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted); }

        @media (max-width: 600px) {
            .header-actions { width: 100%; justify-content: space-between; margin-top: 10px; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tv"></i></div>
            <div class="logo-text"><h1>JioTV+</h1></div>
        </div>
        <div class="header-actions">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search channels...">
            </div>
        </div>
    </header>
    
    <div id="channelGrid" class="channel-grid"></div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div id="modalChannelName" style="font-size:1.5rem; font-weight:800; margin-bottom:1.5rem; color: #fff;">Channel</div>
            <a href="#" class="play-btn" id="playLink"><i class="fas fa-play"></i> Watch Now</a>
            <button id="closeModalBtn" style="margin-top:1.5rem; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size: 1rem;">Cancel</button>
        </div>
    </div>
</div>

<script>
    (function(){
        let allChannels = [];

        const grid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');

        async function loadData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/vaathala00/jow/main/output.json');
                allChannels = await res.json();
                filterAndRender();
            } catch (e) { 
                grid.innerHTML = `<div class="empty-box">Failed to load channels. Check connection.</div>`; 
            }
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = allChannels;

            if (query) {
                filtered = allChannels.filter(ch => ch.name && ch.name.toLowerCase().includes(query));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-box">No channels found.</div>';
                return;
            }

            grid.innerHTML = filtered.map(ch => {
                const isHD = ch.name && (ch.name.includes('HD') || ch.name.includes('FHD'));
                return `
                <div class="channel-card" onclick="openModal('${ch.name.replace(/'/g, "\\'")}', '${ch.link}')">
                    <div class="card-logo"><img src="${ch.logo || 'https://via.placeholder.com/80'}" loading="lazy" alt="logo"></div>
                    <div class="card-name">${ch.name}</div>
                    ${isHD ? '<span class="hd-badge">HD</span>' : ''}
                </div>
            `}).join('');
        }

        window.openModal = (name, link) => {
            document.getElementById('modalChannelName').textContent = name;
            document.getElementById('playLink').href = link;
            modalOverlay.classList.add('show');
        };

        document.getElementById('closeModalBtn').onclick = () => modalOverlay.classList.remove('show');
        
        // Close modal when clicking outside the card
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('show');
        });

        // Search Debounce for better performance
        let searchTimer;
        searchInput.oninput = () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterAndRender, 300);
        };

        loadData();
    })();
</script>
</body>
</html>
