<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VG TV - Channel Grid</title>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-border: #334155;
            --accent: #e50914;
            --text: #f8fafc;
            --sub-text: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        /* --- Header --- */
        .header {
            padding: 20px;
            background: #0b1120;
            border-bottom: 2px solid var(--accent);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .header h1 { font-size: 20px; font-weight: bold; letter-spacing: 1px; }

        /* --- Grid Layout --- */
        .grid-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            align-content: start;
        }

        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            border: 1px solid var(--card-border); 
            cursor: pointer;
            transition: all 0.2s ease; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .card:hover { 
            border-color: var(--accent); 
            transform: translateY(-5px); 
            box-shadow: 0 8px 15px rgba(229, 9, 20, 0.2);
        }

        .card img { 
            width: 80px; 
            height: 80px; 
            object-fit: contain; 
            background: #fff; 
            border-radius: 8px; 
            padding: 5px; 
            margin-bottom: 12px; 
        }

        .card-title { 
            font-size: 14px; 
            font-weight: bold; 
            width: 100%;
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis; 
            margin-bottom: 8px;
        }

        .card-badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            color: var(--sub-text);
            border-left: 2px solid var(--accent);
            text-transform: uppercase;
        }

        .status-msg { grid-column: 1/-1; text-align: center; color: var(--sub-text); padding: 40px; font-size: 16px; }

        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }
        
        .modal-header {
            padding: 20px;
            background: #0b1120;
            border-bottom: 1px solid var(--card-border);
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .modal-header img {
            width: 60px; height: 60px; object-fit: contain; background: #fff; border-radius: 8px; padding: 4px;
        }
        .modal-header-text h2 { font-size: 18px; color: #fff; margin-bottom: 5px; }
        
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            color: var(--sub-text); font-size: 28px;
            cursor: pointer; line-height: 1; transition: 0.2s;
        }
        .close-btn:hover { color: var(--accent); }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .data-group {
            background: #0b1120;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px 15px;
        }
        .data-label {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.5px;
        }
        .data-value {
            font-size: 13px;
            color: #e2e8f0;
            font-family: monospace;
            word-break: break-all;
            user-select: all; /* Makes it easy to copy */
        }
        .data-value.cookie {
            max-height: 80px;
            overflow-y: auto;
            color: #10b981; /* Green color to differentiate cookie */
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); padding: 15px; gap: 10px; }
            .modal-content { width: 95%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>LIVE CHANNELS</h1>
    </div>

    <div id="grid" class="grid-container">
        <div class="status-msg">Fetching Channels Data...</div>
    </div>

    <div id="dataModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <img id="modalImg" src="" alt="Channel Logo">
                <div class="modal-header-text">
                    <h2 id="modalTitle">Channel Name</h2>
                    <span id="modalCategory" class="card-badge">Category</span>
                </div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <div class="data-group">
                    <span class="data-label">Stream URL (MPD)</span>
                    <div id="modalUrl" class="data-value">...</div>
                </div>
                <div class="data-group">
                    <span class="data-label">Key ID (KID)</span>
                    <div id="modalKeyId" class="data-value">...</div>
                </div>
                <div class="data-group">
                    <span class="data-label">Key</span>
                    <div id="modalKey" class="data-value">...</div>
                </div>
                <div class="data-group">
                    <span class="data-label">Auth Cookie</span>
                    <div id="modalCookie" class="data-value cookie">...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/vaathala00/jo/refs/heads/main/stream.json";
        const grid = document.getElementById('grid');
        const modal = document.getElementById('dataModal');

        // Fetch and initialize data
        async function loadChannels() {
            try {
                // Fetch with CORS Proxy fallback just in case GitHub blocks direct browser requests
                let res = await fetch(API_URL);
                if (!res.ok) {
                    res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(API_URL));
                }
                if (!res.ok) throw new Error("Failed to load JSON file.");

                const rawData = await res.json();
                
                // Smart Array Extraction: Finds the channel list whether it's the root array or nested inside an object
                let channelsList = Array.isArray(rawData) ? rawData : [];
                if (channelsList.length === 0 && typeof rawData === 'object') {
                    for (let key in rawData) {
                        if (Array.isArray(rawData[key])) { channelsList = rawData[key]; break; }
                    }
                }

                if (channelsList.length === 0) {
                    grid.innerHTML = '<div class="status-msg">No channels found in the provided JSON.</div>';
                    return;
                }

                // Format & Render
                grid.innerHTML = '';
                channelsList.forEach(channel => {
                    // Adapt to variations in JSON keys
                    const c = {
                        name: channel.channel_name || channel.name || channel.title || "Unknown Channel",
                        logo: channel.channel_logo || channel.logo || "https://via.placeholder.com/100?text=TV",
                        category: channel.channel_category || channel.category || channel.genre || "General",
                        url: channel.channel_url || channel.url || channel.stream_url || "N/A",
                        keyId: channel.channel_key_id || channel.key_id || channel.keyId || channel.kid || "N/A",
                        key: channel.channel_key || channel.key || channel.k || "N/A",
                        cookie: channel.channel_cookie || channel.cookie || channel.__hdnea__ || extractGlobalCookie(rawData) || "N/A"
                    };

                    createCard(c);
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="status-msg" style="color:#ef4444;">Error Loading Data: Make sure the JSON URL is correct and public.</div>`;
            }
        }

        // Extracts a global __hdnea__ cookie if it's placed outside the individual channel objects
        function extractGlobalCookie(data) {
            const str = JSON.stringify(data);
            const match = str.match(/__hdnea__=[^"'\s\\]+/);
            return match ? match[0] : null;
        }

        // Create Grid Card
        function createCard(c) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(c);

            card.innerHTML = `
                <img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/100?text=TV'">
                <div class="card-title" title="${c.name}">${c.name}</div>
                <div class="card-badge">${c.category}</div>
            `;
            grid.appendChild(card);
        }

        // Open Modal with Data
        function openModal(c) {
            document.getElementById('modalImg').src = c.logo;
            document.getElementById('modalTitle').innerText = c.name;
            document.getElementById('modalCategory').innerText = c.category;
            
            document.getElementById('modalUrl').innerText = c.url;
            document.getElementById('modalKeyId').innerText = c.keyId;
            document.getElementById('modalKey').innerText = c.key;
            document.getElementById('modalCookie').innerText = c.cookie;

            modal.classList.add('active');
        }

        // Close Modal
        function closeModal() {
            modal.classList.remove('active');
        }

        // Click outside modal to close
        modal.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initialize
        loadChannels();
    </script>
</body>
</html>
