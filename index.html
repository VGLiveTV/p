<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS Live Player</title>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="https://en.wikipedia.org/wiki/Special:FilePath/Aaj_tak_logo.svg">

<!-- Load mpegts.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.video-container { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
video { width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>

<div class="video-container">
    <!-- Muted is required for autoplay to work in modern browsers -->
    <video id="v" controls autoplay muted playsinline></video>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Your new direct .ts stream URL
    const url = "http://premimum.online/live/jen12345/jen54321/705131.ts";
    const videoElement = document.getElementById('v');

    // Check if the browser supports MSE (Media Source Extensions) required for mpegts.js
    if (mpegts.getFeatureList().mseLivePlayback) {
        const player = mpegts.createPlayer({
            type: 'mse',       // 'mse' tells it to decode raw MPEG-TS
            isLive: true,      // Optimizes buffering for a live stream
            url: url
        });

        player.attachMediaElement(videoElement);
        player.load();
        
        player.play().catch(function(error) {
            console.error("Autoplay was prevented or stream failed to load:", error);
        });

        // Optional: Unmute the video automatically when the user clicks anywhere on the video
        videoElement.addEventListener("click", () => {
            videoElement.muted = false;
        }, { once: true });

    } else {
        alert("Your browser does not support MSE live playback.");
        console.error("MSE is not supported in this browser.");
    }
});
</script>
</body>
</html>
