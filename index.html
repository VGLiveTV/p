<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLiv Playlist Player</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #ffc107; }
        #loading { text-align: center; font-size: 1.2rem; color: #aaa; }
        
        #playlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .channel-card { background: #1e1e1e; border-radius: 10px; padding: 20px; text-decoration: none; color: white; transition: all 0.2s ease-in-out; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 1px solid #333; }
        .channel-card:hover { transform: translateY(-5px); border-color: #ffc107; box-shadow: 0 6px 12px rgba(255, 193, 7, 0.2); }
        .channel-logo { max-width: 100%; height: 120px; margin-bottom: 15px; object-fit: cover; border-radius: 6px; }
        .channel-title { font-size: 16px; font-weight: 600; word-wrap: break-word; }
        
        #debug-log { max-width: 1200px; margin: 20px auto; background: #222; color: #0f0; padding: 15px; font-family: monospace; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>

    <h1>SonyLiv Live Events</h1>
    <div id="loading">Fetching playlist...</div>
    <div id="playlist"></div>
    
    <div id="debug-log">System Status: Starting up...</div>

    <script>
        // Using the direct /main/ path to avoid GitHub redirect issues
        const JSON_URL = 'https://raw.githubusercontent.com/drmlive/sliv-live-events/main/sonyliv.json';
        const PLAYER_BASE_URL = 'https://webplay.rf.gd/sonyliv-events/player.html?url=';
        const debugBox = document.getElementById('debug-log');

        function log(msg, isError = false) {
            debugBox.innerHTML += `<br>> ${isError ? '<span style="color:#ff4c4c;">' + msg + '</span>' : msg}`;
        }

        async function loadPlaylist() {
            try {
                log(`Attempting to download JSON from GitHub...`);
                const response = await fetch(JSON_URL, { cache: "no-store" });
                
                if (!response.ok) {
                    throw new Error(`GitHub Server returned Error ${response.status} (${response.statusText})`);
                }
                
                const data = await response.json();
                log(`JSON downloaded successfully! Scanning for links...`);
                
                document.getElementById('loading').style.display = 'none';
                
                // Extract all valid playable items
                const validItems = extractPlayableItems(data);
                
                if (validItems.length === 0) {
                    log(`ERROR: Could not find any stream links inside the JSON file.`, true);
                    return;
                }

                log(`Found ${validItems.length} playable events. Building cards...`);
                buildCards(validItems);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                log(`CRITICAL FAILURE: ${error.message}`, true);
                log(`Check if the GitHub URL is correct and the repository is public.`, true);
            }
        }

        // DEEP SCANNER: Recursively searches the JSON for anything that looks like a playable stream
        function extractPlayableItems(obj) {
            let foundItems = [];
            
            // If the current object is an array, check all items inside it
            if (Array.isArray(obj)) {
                obj.forEach(item => {
                    foundItems = foundItems.concat(extractPlayableItems(item));
                });
            } 
            // If it's an object, check if it has a URL. If not, scan its children.
            else if (typeof obj === 'object' && obj !== null) {
                const streamUrl = obj.play_url || obj.url || obj.dash_url || obj.hls_url;
                
                if (streamUrl && typeof streamUrl === 'string' && (streamUrl.includes('http') || streamUrl.includes('.mpd') || streamUrl.includes('.m3u8'))) {
                    // We found a valid stream object!
                    foundItems.push(obj);
                } else {
                    // Dig deeper into nested objects
                    for (let key in obj) {
                        foundItems = foundItems.concat(extractPlayableItems(obj[key]));
                    }
                }
            }
            return foundItems;
        }

        function buildCards(items) {
            const playlistContainer = document.getElementById('playlist');
            
            items.forEach((item, index) => {
                const streamUrl = item.play_url || item.url || item.dash_url || item.hls_url;
                const currentName = item.title || item.event_name || item.match_name || item.name || `Live Event ${index + 1}`;
                const currentLogo = item.image || item.thumbnail || item.src || '';

                const finalPlayerUrl = `${PLAYER_BASE_URL}${encodeURIComponent(streamUrl)}`;

                const card = document.createElement('a');
                card.className = 'channel-card';
                card.href = finalPlayerUrl;
                card.target = '_blank';

                if (currentLogo) {
                    const img = document.createElement('img');
                    img.src = currentLogo;
                    img.alt = currentName;
                    img.className = 'channel-logo';
                    img.onerror = function() { this.style.display = 'none'; };
                    card.appendChild(img);
                }

                const title = document.createElement('div');
                title.className = 'channel-title';
                title.textContent = currentName;
                card.appendChild(title);

                playlistContainer.appendChild(card);
            });
            
            log(`Success! Cards are ready to use.`);
        }

        loadPlaylist();
    </script>
</body>
</html>
