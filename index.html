<script>
    (function(){
        // State
        let allChannels = [];
        let filtered = [];
        let bookmarks = JSON.parse(localStorage.getItem('allinone_bookmarks_final')) || [];
        let categories = ['All'];
        let activeCategory = 'All';
        let categoriesExpanded = false;
        let showingBookmarksOnly = false;

        // DOM Elements
        const grid = document.getElementById('channelGrid');
        const catInner = document.getElementById('catInner');
        const searchInput = document.getElementById('searchInput');
        const toggleBtn = document.getElementById('toggleCatsBtn');
        const toggleBtnText = document.getElementById('toggleBtnText');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalChannelName = document.getElementById('modalChannelName');
        const modalGroupId = document.getElementById('modalGroupId');
        const playLink = document.getElementById('playLink');
        const closeModal = document.getElementById('closeModalBtn');
        const bookmarkHeaderBtn = document.getElementById('bookmarkHeaderBtn');
        const bookmarkCount = document.getElementById('bookmarkCount');

        // Fetch Data and Normalize JSON
        async function loadJSON() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/vaathala00/jo/refs/heads/main/stream.json');
                
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                const rawData = await res.json();
                
                // 1. RECURSIVE EXTRACTOR: Digs through the JSON to find the actual array of channels
                function findBiggestArray(obj) {
                    if (Array.isArray(obj)) return obj;
                    if (typeof obj !== 'object' || obj === null) return [];
                    
                    let biggest = [];
                    for (let key in obj) {
                        let child = obj[key];
                        if (Array.isArray(child)) {
                            if (child.length > biggest.length) biggest = child;
                        } else if (typeof child === 'object') {
                            let deeplyNested = findBiggestArray(child);
                            if (deeplyNested.length > biggest.length) biggest = deeplyNested;
                        }
                    }
                    return biggest;
                }

                const channelArray = findBiggestArray(rawData);

                if (channelArray.length === 0) {
                    throw new Error("Found the file, but it doesn't contain a list of channels.");
                }

                // 2. FUZZY DATA NORMALIZATION: Auto-detects the right properties
                allChannels = channelArray.map((ch, index) => {
                    // Fallback for simple string arrays
                    if (typeof ch === 'string') {
                        return { id: String(index), name: 'Channel ' + (index+1), group: 'Other', logo: 'https://via.placeholder.com/150', link: ch };
                    }

                    // Helper function to search for keywords inside the JSON keys
                    const getByKeyword = (keywords) => {
                        for (let key in ch) {
                            if (keywords.some(kw => key.toLowerCase().includes(kw)) && typeof ch[key] === 'string' && ch[key].trim() !== '') {
                                return ch[key];
                            }
                        }
                        return null;
                    };

                    return {
                        id: String(ch.id || getByKeyword(['id']) || index),
                        name: ch.name || ch.title || getByKeyword(['name', 'title', 'ch']) || 'Channel ' + (index + 1),
                        group: ch.group || ch.category || getByKeyword(['group', 'cat', 'genre']) || 'Other',
                        logo: ch.logo || ch['tvg-logo'] || getByKeyword(['logo', 'icon', 'img', 'pic']) || 'https://via.placeholder.com/150',
                        link: ch.url || ch.link || getByKeyword(['url', 'link', 'stream', 'src', 'file', 'm3u8', 'play']) || '#'
                    };
                });

                // Force UI update
                extractCategories();
                updateBookmarkCount();
                filterAndRender();
                
            } catch (e) {
                console.error("Fetch Error:", e);
                grid.innerHTML = `<div class="empty-box">
                    <i class="fas fa-exclamation-circle" style="font-size:2rem;margin-bottom:10px;"></i><br>
                    Could not load channels.<br>
                    <small style="opacity: 0.6; display:block; margin-top:8px;">${e.message}</small>
                </div>`;
            }
        }

        function extractCategories() {
            const catSet = new Set();
            allChannels.forEach(ch => { 
                if (ch.group && ch.group.trim()) catSet.add(ch.group.trim()); 
            });
            categories = ['All', ...Array.from(catSet).sort()];
            renderCategories();
        }

        function renderCategories() {
            const limit = categoriesExpanded ? categories.length : 6;
            const visibleCats = categories.slice(0, limit);
            
            let html = visibleCats.map(cat => 
                `<span class="cat-chip ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</span>`
            ).join('');
            
            if (categories.length > 6 && !categoriesExpanded) {
                html += `<span class="cat-chip">+${categories.length - 6} more</span>`;
            }

            catInner.innerHTML = html;
            
            document.querySelectorAll('.cat-chip[data-cat]').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    activeCategory = e.target.dataset.cat;
                    showingBookmarksOnly = false;
                    bookmarkHeaderBtn.classList.remove('active');
                    renderCategories();
                    filterAndRender();
                });
            });

            toggleBtn.style.display = categories.length > 6 ? 'inline-block' : 'none';
            toggleBtnText.innerText = categoriesExpanded ? 'Show Less' : 'Show More';
        }

        toggleBtn.addEventListener('click', () => {
            categoriesExpanded = !categoriesExpanded;
            renderCategories();
        });

        function filterAndRender() {
            const query = searchInput.value.trim().toLowerCase();
            let temp = [...allChannels];

            if (showingBookmarksOnly) {
                temp = temp.filter(ch => bookmarks.includes(ch.id));
            } else if (activeCategory !== 'All') {
                temp = temp.filter(ch => ch.group === activeCategory);
            }
            
            if (query) {
                temp = temp.filter(ch => ch.name.toLowerCase().includes(query));
            }

            filtered = temp;
            renderGrid(filtered);
        }

        function renderGrid(channels) {
            if (channels.length === 0) {
                grid.innerHTML = `<div class="empty-box">No channels found.</div>`;
                return;
            }

            grid.innerHTML = channels.map(ch => {
                const isBookmarked = bookmarks.includes(ch.id);
                const isHD = ch.name && (ch.name.includes('HD') || ch.name.includes('FHD'));
                
                return `
                <div class="channel-card" data-id="${ch.id}" data-name="${ch.name}" data-link="${ch.link}" data-group="${ch.group}">
                    <div class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="event.stopPropagation(); toggleBookmark('${ch.id}', this)">
                        <i class="fas fa-bookmark"></i>
                    </div>
                    <div class="card-logo">
                        <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="card-name">${ch.name}</div>
                    <div class="card-badges">
                        ${isHD ? '<span class="hd-badge">HD</span>' : ''}
                        <span class="cat-tag">${ch.group.slice(0, 8)}</span>
                    </div>
                </div>
                `;
            }).join('');

            document.querySelectorAll('.channel-card').forEach(card => {
                card.addEventListener('click', () => {
                    openModal(card.dataset.name, card.dataset.group, card.dataset.link);
                });
            });
        }

        window.toggleBookmark = function(id, btnElement) {
            const index = bookmarks.indexOf(String(id));
            if (index === -1) {
                bookmarks.push(String(id));
                btnElement.classList.add('active');
            } else {
                bookmarks.splice(index, 1);
                btnElement.classList.remove('active');
            }
            localStorage.setItem('allinone_bookmarks_final', JSON.stringify(bookmarks));
            updateBookmarkCount();
            if (showingBookmarksOnly) filterAndRender();
        };

        function updateBookmarkCount() {
            bookmarkCount.textContent = bookmarks.length;
            bookmarkCount.style.display = bookmarks.length > 0 ? 'flex' : 'none';
        }

        bookmarkHeaderBtn.addEventListener('click', () => {
            if (bookmarks.length === 0) {
                alert("You haven't bookmarked any channels yet.");
                return;
            }
            showingBookmarksOnly = !showingBookmarksOnly;
            bookmarkHeaderBtn.classList.toggle('active', showingBookmarksOnly);
            if(showingBookmarksOnly) {
                activeCategory = 'All'; 
                renderCategories(); 
            }
            filterAndRender();
        });

        // Modal Logic
        function openModal(name, group, link) {
            modalChannelName.textContent = name;
            modalGroupId.textContent = group;
            playLink.href = link;
            modalOverlay.classList.add('show');
        }

        closeModal.addEventListener('click', () => modalOverlay.classList.remove('show'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('show');
        });

        // Search Debounce
        let searchTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterAndRender, 300);
        });

        // Init
        loadJSON();

    })();
</script>
