<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sony Ten 3 HD</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
        video { width: 100vw; height: 100vh; outline: none; object-fit: contain; }
    </style>
</head>
<body>

<video id="video" controls autoplay muted playsinline></video>

<script>
    const video = document.getElementById('video');
    
    // The raw stream link
    const targetStream = "https://sl.vodep39240327.workers.dev/channel/SONY%20TEN%203%20HD.m3u8";
    
    // The proxy link - Notice how it just stacks the URLs together
    const proxyUrl = "https://stream-proxy.vgtv.workers.dev/" + targetStream;

    if (Hls.isSupported()) {
        const hls = new Hls({
            maxBufferLength: 10,
            maxMaxBufferLength: 20,
        });
        
        hls.loadSource(proxyUrl);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(() => console.log("Click play to start video."));
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Fallback for Safari/Apple devices
        video.src = proxyUrl;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
</script>

</body>
</html>
