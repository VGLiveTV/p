<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channels Grid - Diagnostic</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #e50914; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px;}
        .card { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .card img { width: 60px; height: 60px; object-fit: contain; background: #fff; border-radius: 6px; padding: 4px; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        /* Debug Console Styles */
        .debug-container { grid-column: 1 / -1; background: #000; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        .debug-box { color: #10b981; font-family: monospace; white-space: pre-wrap; overflow-x: auto; font-size: 12px; background: #111; padding: 10px; border-radius: 4px; margin-top: 10px; max-height: 300px; overflow-y: auto;}
    </style>
</head>
<body>
    <h2 style="text-align: center; margin-bottom: 10px;">Live Channels</h2>
    
    <div id="grid" class="grid">
        <div style="text-align:center; grid-column:1/-1; color:#888;">Fetching Data...</div>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/vaathala00/jo/refs/heads/main/stream.json";
        const grid = document.getElementById('grid');

        async function loadChannels() {
            try {
                // Attempt direct fetch
                let res = await fetch(API_URL);
                
                // If direct fails (CORS), use proxy
                if (!res.ok) {
                    res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(API_URL));
                }
                
                // If proxy also fails, throw error
                if (!res.ok) throw new Error(`HTTP Error ${res.status}: The file might be Private or Deleted.`);

                const rawData = await res.json();
                
                // SMART ARRAY FINDER
                // If the JSON isn't an array directly, look for an array inside the object
                let channelsArray = [];
                if (Array.isArray(rawData)) {
                    channelsArray = rawData;
                } else if (typeof rawData === 'object') {
                    for (let key in rawData) {
                        if (Array.isArray(rawData[key])) {
                            channelsArray = rawData[key];
                            break;
                        }
                    }
                }

                // If no array could be found anywhere
                if (channelsArray.length === 0) {
                    grid.innerHTML = `
                        <div class="debug-container">
                            <h3 style="color:#f59e0b;">JSON Loaded, but couldn't find a list of channels!</h3>
                            <p style="font-size:14px; margin-top:5px; color:#ccc;">Here is a preview of what the file actually contains:</p>
                            <div class="debug-box">${JSON.stringify(rawData, null, 2)}</div>
                        </div>`;
                    return;
                }

                // If successful, render the cards
                grid.innerHTML = '';
                channelsArray.forEach(c => {
                    const name = c.channel_name || c.name || c.title || "Unknown Channel";
                    const logo = c.channel_logo || c.logo || c.logo_url || "https://via.placeholder.com/60?text=TV";
                    
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${logo}" onerror="this.src='https://via.placeholder.com/60?text=TV'">
                            <div class="card-title" title="${name}">${name}</div>
                        </div>
                    `;
                });

            } catch (err) {
                // Display the exact error on screen
                grid.innerHTML = `
                    <div class="debug-container">
                        <h3 style="color:#ef4444;">Failed to Load JSON File</h3>
                        <div class="debug-box" style="color:#ef4444;">${err.message}</div>
                        <p style="margin-top:15px; font-size:14px; color:#aaa;">
                            <strong>Troubleshooting:</strong><br>
                            1. Go to your GitHub Repository Settings.<br>
                            2. Scroll down to "Danger Zone".<br>
                            3. Ensure the repository visibility is set to <strong>Public</strong>.
                        </p>
                    </div>`;
            }
        }

        loadChannels();
    </script>
</body>
</html>
