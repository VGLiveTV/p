<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VG Tools</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/0jjHzmFq/vgtools.png">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Arial, sans-serif; 
        }
        
        body { 
            min-height: 100vh; 
            color: #333; 
            background: #fff;
            -webkit-overflow-scrolling: touch; 
        }
        
        .content { 
            padding: 20px; 
            text-align: center; 
        }
        
        .logo { 
            max-width: 150px; 
            margin: 10px 0 30px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        
        .card { 
            display: block; 
            border: 2px solid red; 
            border-radius: 10px; 
            padding: 15px; 
            text-decoration: none; 
            color: inherit; 
            transition: .2s; 
        }
        
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 5px 15px rgba(255,0,0,.2); 
        }
        
        .card img { 
            height: 80px; 
            max-width: 100%; 
            object-fit: contain; 
            margin-bottom: 10px; 
        }
        
        .card span { 
            font-size: 15px; 
            font-weight: bold; 
            display: block; 
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="https://i.ibb.co/0jjHzmFq/vgtools.png" class="logo" alt="VG Tools Logo">
        
        <div class="grid">
            <a href="idcardtool.html" target="_blank" class="card">
                <img src="https://i.ibb.co/TxxkVCCk/idcardtool.png" alt="ID Card Tool">
                <span>ID Card Tool</span>
            </a>
            
            <a href="whatsappimageprinttool.html" target="_blank" class="card">
                <img src="https://i.ibb.co/Kc9xVwMN/whatsappprinttool.png" alt="Whatsapp Image Print Tool">
                <span>Whatsapp Image Print Tool</span>
            </a>
            
            <a href="photonamejoiner.html" target="_blank" class="card">
                <img src="https://i.ibb.co/4nhqQqgb/photonamejoiner.png" alt="Photo Name Joiner">
                <span>Photo Name Joiner</span>
            </a>
            
            <a href="https://willowsportslive.pages.dev/" target="_blank" class="card">
                <img src="https://i.ibb.co/0pYb1KV0/willowsports.png" alt="Willow Sports">
                <span>Willow Sports</span>
            </a>
            
            <a href="https://fancodelive1.pages.dev/" target="_blank" class="card">
                <img src="https://i.ibb.co/Kp3GTp4C/fancode.png" alt="FanCode 1">
                <span>FanCode 1</span>
            </a>
            
            <a href="https://fancodelive2.pages.dev/" target="_blank" class="card">
                <img src="https://i.ibb.co/Kp3GTp4C/fancode.png" alt="FanCode 2">
                <span>FanCode 2</span>
            </a>
        </div>
    </div>

</body>
</html>
