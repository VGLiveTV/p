<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sports Hindi Channels</title>
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon fill='red' points='50,10 61,40 94,40 68,60 78,90 50,70 22,90 32,60 6,40 39,40'/></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.20/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.20/dist/controls.css"/>

    <style>
        :root {
            --bg-dark: #0a0e27;
            --accent: #00ff9f;
            --card-bg: rgba(20, 25, 45, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Archivo', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Main Menu (Grid) Styles --- */
        #grid-view {
            display: none; /* Hidden by default, JS will reveal if no channel is selected */
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .header {
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent);
            text-shadow: 0 0 20px rgba(0, 255, 159, 0.5);
            margin: 0;
            font-size: 2.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }

        .channel-card {
            background: var(--card-bg);
            border: 2px solid rgba(0, 255, 159, 0.2);
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }

        .channel-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 255, 159, 0.2);
        }

        .logo-box {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .logo-box img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .live-badge {
            background: #ff4757;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* --- Player View Styles --- */
        #player-view {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .shaka-video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .custom-watermark {
            position: absolute;
            z-index: 40;
            pointer-events: none;
            top: 65%;
            left: 6%;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.12);
        }

        @media (max-width: 700px) {
            .header h1 { font-size: 1.8rem; }
            .grid-container { grid-template-columns: 1fr; }
            .custom-watermark { font-size: 9px; top: 60%; left: 16%; }
        }
    </style>
</head>
<body>

    <div id="grid-view">
        <div class="header">
            <h1>📺 Star Sports Channels</h1>
            <p style="margin-top:10px;">Premium Star Sports Hindi Channels</p>
        </div>

        <div class="grid-container">
            <a href="?channel=ss1h" target="_blank" class="channel-card">
                <div class="logo-box">
                    <img src="https://github.com/VGLive/SS1H/blob/main/1.png?raw=true" alt="Star Sports 1 Hindi HD">
                </div>
                <div class="channel-name">Star Sports 1 Hindi HD</div>
                <div class="live-badge">Live</div>
            </a>

            <a href="?channel=ss2h" target="_blank" class="channel-card">
                <div class="logo-box">
                    <img src="https://github.com/VGLive/SS2H/blob/main/2.png?raw=true" alt="Star Sports 2 Hindi HD">
                </div>
                <div class="channel-name">Star Sports 2 Hindi HD</div>
                <div class="live-badge">Live</div>
            </a>

            <a href="?channel=ss1" target="_blank" class="channel-card">
                <div class="logo-box">
                    <img src="https://github.com/VGLive/SS1/blob/main/1.png?raw=true" alt="Star Sports 1 HD">
                </div>
                <div class="channel-name">Star Sports 1 Hindi</div>
                <div class="live-badge">Live</div>
            </a>

            <a href="?channel=ss2" target="_blank" class="channel-card">
                <div class="logo-box">
                    <img src="https://github.com/VGLive/SS2/blob/main/2.png?raw=true" alt="Star Sports 2 HD">
                </div>
                <div class="channel-name">Star Sports 2 Hindi</div>
                <div class="live-badge">Live</div>
            </a>
        </div>
    </div>

    <div id="player-view">
        <div class="shaka-video-container" id="player-container">
            <video id="video" autoplay muted playsinline preload="metadata"></video>
            <div class="custom-watermark"> </div>
        </div>
    </div>

    <script>
        // Channel Data Configuration
        const channels = {
            ss1h: {
                title: "Star Sports 1 Hindi HD",
                streamUrl: "https://jiotvmblive.cdn.jio.com//bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd",
                keyId: "400131994b445d8c8817202248760fda",
                key: "2d56cb6f07a75b9aff165d534ae2bfc4"
            },
            ss2h: {
                title: "Star Sports 2 Hindi HD",
                streamUrl: "https://jiotvmblive.cdn.jio.com//bpk-tv/StarSportsHD2Hin_BTS/output/index.mpd",
                keyId: "bd1ea6a1c1fb5dcdb709434e0826bbc0",
                key: "f57f22cba32739ce7beb1fab3f3d060b"
            },
            ss1: {
                title: "Star Sports 1 Hindi",
                streamUrl: "https://jiotvmblive.cdn.jio.com//bpk-tv/Star_Sports_1_Hindi_BTS/output/index.mpd",
                keyId: "8ea9b607549252068e260a5f4d7dd321",
                key: "350c0aaffedf51cc1502e9543c7c885e"
            },
            ss2: {
                title: "Star Sports 2 Hindi",
                streamUrl: "https://jiotvmblive.cdn.jio.com//bpk-tv/StarSports2Hin_BTS/output/index.mpd",
                keyId: "a3ed8dc0e0cb5d238da80ee0a85bd2e1",
                key: "67a96992e6406606f3480ab58d7f540c"
            }
        };

        const cookieUrl = "https://raw.githubusercontent.com/vaathala00/jow/main/output.json";

        document.addEventListener("DOMContentLoaded", async () => {
            // Check the URL for a 'channel' parameter
            const urlParams = new URLSearchParams(window.location.search);
            const currentChannelId = urlParams.get('channel');

            if (currentChannelId && channels[currentChannelId]) {
                // If a valid channel is in the URL, show the player
                document.getElementById('player-view').style.display = 'block';
                document.title = channels[currentChannelId].title;
                await initPlayer(channels[currentChannelId]);
            } else {
                // Otherwise, show the main menu
                document.getElementById('grid-view').style.display = 'flex';
            }
        });

        // Function to initialize and load the video player
        async function initPlayer(config) {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                alert("Browser not supported for video streaming.");
                return;
            }

            const video = document.getElementById("video");
            const container = document.getElementById("player-container");

            video.muted = true;

            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, container, video);

            ui.configure({
                addBigPlayButton: true,
                controlPanelElements: ["play_pause", "mute", "volume", "spacer", "quality", "picture_in_picture", "fullscreen"],
                seekBarColors: { base: "white", buffered: "red", played: "green" }
            });

            // Fetch generic cookie data
            let cookieValue = "";
            try {
                const response = await fetch(cookieUrl, { cache: "no-store" });
                const rawText = await response.text();
                const match = rawText.match(/__hdnea__=[A-Za-z0-9~=/*_-]+/);
                if (match) cookieValue = match[0];
            } catch (e) {
                console.error("Failed to fetch cookie:", e);
            }

            // Setup network filters for the cookie
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                if (cookieValue) {
                    let urlCookie = cookieValue.startsWith("__hdnea__=") ? cookieValue.substring(10) : cookieValue;
                    if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
                         type === shaka.net.NetworkingEngine.RequestType.SEGMENT) && 
                         !request.uris[0].includes("__hdnea__")) {
                        const sep = request.uris[0].includes("?") ? "&" : "?";
                        request.uris[0] += sep + "__hdnea__=" + urlCookie;
                    }
                }
            });

            // Configure Player
            player.configure({
                drm: { clearKeys: { [config.keyId]: config.key } },
                manifest: { defaultPresentationDelay: 5 },
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 10,
                    rebufferingGoal: 2,
                    safeSeekOffset: 5
                }
            });

            // Load Stream
            try {
                await player.load(config.streamUrl);
                video.play().catch(() => {});
            } catch (e) {
                console.error("Error loading stream", e);
            }

            // Handle unmuting logic
            video.addEventListener("play", () => {
                video.muted = false;
            }, { once: true });
        }
    </script>
</body>
</html>
