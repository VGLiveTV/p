<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Universal Web Player (TS & M3U8)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #1e1e1e; /* VLC-style dark theme */
            color: white;
            font-family: Arial, sans-serif;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #2d2d2d;
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .header input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 16px;
        }
        .header button {
            padding: 10px 20px;
            background: #ff8c00; /* Orange play button */
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header button:hover {
            background: #e67e00;
        }
        .player-container {
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
            object-fit: contain;
        }
        .error-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            display: none;
            z-index: 20;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="streamUrl" placeholder="Paste .m3u8 or .ts stream link here..." value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">
        <button onclick="loadStream()">Play</button>
    </div>
    
    <div class="player-container">
        <div id="errorBox" class="error-message"></div>
        <video id="videoElement" controls autoplay playsinline></video>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const errorBox = document.getElementById('errorBox');
        
        let hlsEngine = null;
        let tsEngine = null;

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
            console.error("Player Error:", msg);
            setTimeout(() => { errorBox.style.display = 'none'; }, 8000);
        }

        // Completely wipes the previous stream before starting a new one
        function destroyEngines() {
            if (hlsEngine) {
                hlsEngine.destroy();
                hlsEngine = null;
            }
            if (tsEngine) {
                tsEngine.destroy();
                tsEngine = null;
            }
            video.src = "";
            video.removeAttribute('src');
            video.load();
        }

        function loadStream() {
            destroyEngines();
            errorBox.style.display = 'none';
            
            const url = document.getElementById('streamUrl').value.trim();
            if (!url) {
                showError("Please enter a stream URL.");
                return;
            }

            // Detect format based on the URL extension
            const isRawTS = url.includes('.ts');
            const isM3U8 = url.includes('.m3u8') || url.includes('.m3u');

            // --- ENGINE 1: mpegts.js for Raw .TS Streams ---
            if (isRawTS && !isM3U8) {
                console.log("Starting MPEG-TS Engine...");
                if (mpegts.getFeatureList().mseLivePlayback) {
                    tsEngine = mpegts.createPlayer({
                        type: 'mse',
                        isLive: true,
                        url: url
                    });
                    tsEngine.attachMediaElement(video);
                    tsEngine.load();
                    tsEngine.play().catch(e => console.log("Autoplay blocked. User needs to click play."));
                } else {
                    showError("Your browser does not support raw MPEG-TS playback.");
                }
            } 
            
            // --- ENGINE 2: Hls.js for .m3u8 Streams ---
            else { 
                console.log("Starting HLS Engine...");
                if (Hls.isSupported()) {
                    hlsEngine = new Hls({
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                    });
                    hlsEngine.loadSource(url);
                    hlsEngine.attachMedia(video);
                    
                    hlsEngine.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay blocked. User needs to click play."));
                    });
                    
                    hlsEngine.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            showError("HLS Fatal Error: " + data.type + " | " + data.details);
                        }
                    });
                } 
                // Native fallback (mainly for Safari on iOS/Mac)
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(e => console.log(e));
                    });
                } else {
                    showError("HLS playback is not supported in this browser.");
                }
            }
        }

        // Automatically load the default test stream when the page opens
        window.onload = loadStream;
    </script>
</body>
</html>
