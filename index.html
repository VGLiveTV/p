<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTv+ Player</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            color: var(--text-main);
        }

        .app { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 0 1rem 1.5rem 1rem; 
        }

        /* Header (Frozen/Sticky) */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 1rem; padding: 1rem 0; margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

        .logo-icon {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: var(--primary);
            transition: 0.3s;
        }

        .logo-text h1 {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px;
        }

        .channel-count {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted); /* Overrides gradient for the span */
            background: none;
            margin-top: 2px;
        }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .search-wrapper {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 16px; padding: 0.5rem 1rem; border: 1px solid var(--card-border);
            width: min(320px, 100%); backdrop-filter: blur(10px);
        }
        
        .search-wrapper input {
            background: transparent; border: none; outline: none;
            width: 100%; color: white; padding-right: 10px; flex: 1;
        }

        .search-wrapper i {
            color: var(--text-muted);
        }

        /* Grid */
        .channel-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.2rem;
        }

        .channel-card {
            background: var(--card-bg); border-radius: 20px; padding: 1rem 0.5rem;
            border: 1px solid var(--card-border); position: relative;
            cursor: pointer; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .channel-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.9); border-color: rgba(56, 189, 248, 0.4);}

        .card-logo {
            width: 80px; height: 80px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.6); border-radius: 18px; padding: 8px;
        }
        
        .card-logo img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

        .card-name { font-weight: 600; font-size: 0.85rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }

        .empty-box { grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted); }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .header {
                flex-wrap: nowrap; gap: 10px;
            }
            .header-actions {
                width: auto; flex: 1; margin-top: 0;
            }
            .search-wrapper {
                width: 100%; padding: 0.4rem 0.8rem;
            }
            .channel-grid { 
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            }
            .card-logo { 
                width: 60px; height: 60px; 
            }
            .logo-icon { 
                width: 35px; height: 35px; font-size: 1.4rem; 
            }
            .logo-text h1 { 
                font-size: 1.2rem; 
            }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tv"></i></div>
            <div class="logo-text">
                <h1>JioTV+ <span id="channelCount" class="channel-count"></span></h1>
            </div>
        </div>
        <div class="header-actions">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search channels...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>
    
    <div id="channelGrid" class="channel-grid"></div>
</div>

<script>
    (function(){
        let allChannels = [];

        const grid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const countDisplay = document.getElementById('channelCount');

        async function loadData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/vaathala00/jow/main/output.json');
                allChannels = await res.json();
                
                // Sort channels alphabetically by name
                allChannels.sort((a, b) => {
                    const nameA = a.name ? a.name.toLowerCase() : '';
                    const nameB = b.name ? b.name.toLowerCase() : '';
                    return nameA.localeCompare(nameB);
                });

                filterAndRender();
            } catch (e) { 
                grid.innerHTML = `<div class="empty-box">Failed to load channels. Check connection.</div>`; 
            }
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = allChannels;

            if (query) {
                filtered = allChannels.filter(ch => ch.name && ch.name.toLowerCase().includes(query));
            }

            // Update the channel count text
            countDisplay.textContent = `(${filtered.length})`;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-box">No channels found.</div>';
                return;
            }

            grid.innerHTML = filtered.map(ch => {
                return `
                <div class="channel-card" onclick="window.open('${ch.link}', '_blank')">
                    <div class="card-logo"><img src="${ch.logo || 'https://via.placeholder.com/80'}" loading="lazy" alt="logo"></div>
                    <div class="card-name">${ch.name}</div>
                </div>
            `}).join('');
        }

        let searchTimer;
        searchInput.oninput = () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterAndRender, 300);
        };

        loadData();
    })();
</script>
</body>
</html>
