<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        /* Remove all margins, padding, and scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Pure black background */
            overflow: hidden; 
        }
        .player-container {
            width: 100vw; /* 100% of viewport width */
            height: 100vh; /* 100% of viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps the aspect ratio so the video isn't stretched */
            outline: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="videoElement" controls autoplay muted></video>
    </div>

    <script>
        if (mpegts.getFeatureList().mseLivePlayback) {
            var videoElement = document.getElementById('videoElement');
            
            var player = mpegts.createPlayer({
                type: 'mse',
                isLive: true,
                url: 'https://tinyurl.com/link-macha-official-collab-vt/705141.ts'
            });
            
            player.attachMediaElement(videoElement);
            player.load();
            player.play().catch(function(error) {
                console.log("Autoplay was prevented by the browser. The user needs to click play.");
            });
        } else {
            alert('Your browser does not support MPEG-TS playback.');
        }
    </script>

</body>
</html>
