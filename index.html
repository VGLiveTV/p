<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV One</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="https://i.postimg.cc/02hBbWKp/IP.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {            
            --bg: #fef2f2; --card: rgba(255,255,255,0.85); --border: rgba(220,38,38,0.2);            
            --red: #dc2626; --text: #1e293b; --muted: #64748b;        
        }        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }        
        body { background: radial-gradient(circle at top left, #fee2e2, #fef2f2); min-height: 100vh; color: var(--text); }        
        .app { max-width: 1400px; margin: 0 auto; padding: 0 1rem 1.5rem; }
        
        .header { position: sticky; top: 0; z-index: 100; background: transparent; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0; margin-bottom: 1.5rem; }
        .logo-area { display: flex; align-items: center; gap: 10px; flex-shrink: 0; white-space: nowrap; }        
        .logo-icon { width: 75px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: var(--red); }        
        .logo-icon img { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }
        .actions { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
        
        .filter, .search { background: var(--card); border: 1px solid var(--border); border-radius: 16px; outline: none; transition: 0.3s; }
        .filter { color: var(--text); padding: 0.5rem 2rem 0.5rem 1rem; cursor: pointer; -webkit-appearance: none; appearance: none; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
        .search { display: flex; align-items: center; padding: 0.5rem 1rem; width: 100%; max-width: 250px; }
        .search input { background: transparent; border: none; outline: none; width: 100%; color: var(--text); }
        .search i { color: var(--red); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.2rem; }
        .card { background: var(--card); border-radius: 20px; padding: 1rem 0.5rem; border: 1px solid var(--border); cursor: pointer; text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-4px); background: #fee2e2; }
        .card-logo { width: 80px; height: 80px; margin: 0 auto 10px; background: lightgrey; border-radius: 18px; padding: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .card-logo img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }
        
        /* Player Styles */
        #player-view { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 90vh; background: #000; }
        
        /* Quality Dropdown styling */
        #qualitySelect { position: absolute; bottom: 20px; right: 20px; z-index: 1001; background: rgba(0,0,0,0.7); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }

        video::-webkit-media-controls-timeline, 
        video::-webkit-media-controls-current-time-display, 
        video::-webkit-media-controls-time-remaining-display { display: none !important; }
    </style>
</head>
<body>

    <div id="grid-view" class="app">
        <header class="header">
            <div class="logo-area"><div class="logo-icon"><img src="https://i.postimg.cc/bvcWFCz1/iptv.png" alt="Logo"></div></div>
            <div class="actions">
                <select id="categoryDropdown" class="filter"></select>
                <div class="search"><input type="text" id="searchInput" placeholder="Search..."><i class="fas fa-search"></i></div>
            </div>
        </header>
        <div id="loading" class="loader">Loading channels...</div>
        <div class="grid" id="channelGrid"></div>
    </div>
    
    <div id="player-view">
        <select id="qualitySelect"><option value="-1">Auto Quality</option></select>
        <video id="v" controls autoplay muted playsinline></video>
    </div>

    <script>
        let allChannels = [];
        const streamUrl = new URLSearchParams(window.location.search).get('url');

        if (streamUrl) {
            document.getElementById('grid-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            initHlsPlayer(streamUrl);
        } else {
            initGrid();
        }

        // ... (initGrid and filterChannels functions remain the same as previously provided) ...
        async function initGrid() {
            try {
                const res = await fetch('https://iptv-org.github.io/iptv/languages/hin.m3u');
                const data = await res.text();
                let curr = {};
                data.split('\n').forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        curr.logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || 'https://via.placeholder.com/80x80.png?text=No+Logo';
                        curr.group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Other';
                        curr.name = line.split(',').pop().trim() || 'Unknown';
                    } else if (line && !line.startsWith('#') && line.startsWith('https://')) {
                        allChannels.push({...curr, url: line});
                        curr = {}; 
                    }
                });
                document.getElementById('loading').style.display = 'none';
                filterChannels();
            } catch (e) { document.getElementById('loading').innerText = 'Error loading playlist.'; }
        }

        function filterChannels() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';
            allChannels.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-logo"><img src="${c.logo}" loading="lazy"></div><div class="card-name">${c.name}</div>`;
                card.onclick = () => window.open(`/?url=${encodeURIComponent(c.url)}`, '_blank');
                grid.appendChild(card);
            });
        }

        function initHlsPlayer(url) {
            const video = document.getElementById('v');
            const qualitySelect = document.getElementById('qualitySelect');

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    video.play();
                    // Populate Quality Dropdown
                    data.levels.forEach((level, index) => {
                        let option = document.createElement('option');
                        option.value = index;
                        option.text = level.height + "p";
                        qualitySelect.appendChild(option);
                    });
                });

                qualitySelect.addEventListener('change', (e) => {
                    hls.currentLevel = parseInt(e.target.value);
                });
            } else {
                video.src = url;
            }
        }
    </script>
</body>
</html>
