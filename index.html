<!DOCTYPE html>
<title>4K Stream</title>
<style>
    body { margin: 0; background: #000; overflow: hidden; }
    video { width: 100vw; height: 100vh; outline: none; }
</style>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<video id="v" controls autoplay muted></video>

<script>
    const stream = 'https://tinyurl.com/link-macha-official-collab-vt/705141.ts';
    
    const proxy = 'https://stream-proxy.vgtv.workers.dev/?url=' + encodeURIComponent(stream);

    let player = mpegts.createPlayer({
        type: 'mse',
        isLive: true,
        url: proxy
    });
    
    player.attachMediaElement(document.getElementById('v'));
    player.load();
    player.play();
</script>
