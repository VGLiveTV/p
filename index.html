<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTv+ Player</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            color: var(--text-main);
        }

        .app { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 1rem; margin-bottom: 2rem; padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }

        .logo-icon {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: white;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .logo-text h1 {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }

        .bookmark-header-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-muted); width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; backdrop-filter: blur(10px);
        }
        
        .bookmark-header-btn.active { background: var(--accent-color); color: #0f172a; }
        
        .bookmark-count {
            position: absolute; top: -4px; right: -4px; background: #ef4444;
            color: white; font-size: 0.7rem; font-weight: 700;
            min-width: 18px; height: 18px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-color);
        }

        .search-wrapper {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 16px; padding: 0.5rem 1rem; border: 1px solid var(--card-border);
            width: min(320px, 100%); backdrop-filter: blur(10px);
        }
        
        .search-wrapper input {
            background: transparent; border: none; outline: none;
            width: 100%; color: white; padding-left: 10px;
        }

        /* Categories */
        .cats-inner { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }

        .cat-chip {
            background: rgba(255,255,255,0.03); padding: 0.5rem 1.2rem;
            border-radius: 20px; font-size: 0.85rem; color: var(--text-muted);
            cursor: pointer; transition: 0.2s;
        }
        
        .cat-chip.active { background: var(--accent-color); color: #0f172a; font-weight: 700; }

        /* Grid */
        .channel-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.2rem;
        }

        .channel-card {
            background: var(--card-bg); border-radius: 20px; padding: 1rem 0.5rem;
            border: 1px solid var(--card-border); position: relative;
            cursor: pointer; text-align: center; transition: 0.3s;
        }
        
        .channel-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.9); }

        .card-logo {
            width: 80px; height: 80px; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
        }
        
        .card-logo img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

        .card-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .hd-badge { background: linear-gradient(135deg, #ec4899, #8b5cf6); font-size: 0.6rem; padding: 2px 8px; border-radius: 6px; color: white; font-weight: 700; }

        .bookmark-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(15, 23, 42, 0.8);
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--text-muted);
        }
        
        .bookmark-btn.active { color: #ef4444; border: 1px solid #ef4444; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px);
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal-card {
            background: #1e293b; width: 90%; max-width: 400px; border-radius: 24px;
            padding: 2rem; border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }

        .play-btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 1rem; background: var(--accent-color); color: #0f172a;
            border-radius: 16px; font-weight: 700; text-decoration: none; gap: 10px;
        }

        .empty-box { grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted); }

        @media (max-width: 600px) {
            .header-actions { width: 100%; justify-content: space-between; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-tv"></i></div>
            <div class="logo-text"><h1>JioTV+</h1></div>
        </div>
        <div class="header-actions">
            <div class="bookmark-header-btn" id="bookmarkHeaderBtn">
                <i class="fas fa-bookmark"></i>
                <span class="bookmark-count" id="bookmarkCount">0</span>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search...">
            </div>
        </div>
    </header>
    
    <div class="cats-inner" id="catInner"></div>
    <div id="channelGrid" class="channel-grid"></div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div id="modalChannelName" style="font-size:1.5rem; font-weight:800; margin-bottom:1rem;">Channel</div>
            <a href="#" class="play-btn" id="playLink"><i class="fas fa-play"></i> Watch Now</a>
            <button id="closeModalBtn" style="margin-top:1.5rem; background:none; border:none; color:var(--text-muted); cursor:pointer;">Cancel</button>
        </div>
    </div>
</div>

<script>
    (function(){
        let allChannels = [], bookmarks = JSON.parse(localStorage.getItem('jio_bookmarks')) || [];
        let activeCategory = 'All', showingBookmarksOnly = false;

        const grid = document.getElementById('channelGrid'), catInner = document.getElementById('catInner');
        const searchInput = document.getElementById('searchInput'), modalOverlay = document.getElementById('modalOverlay');

        async function loadData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/vaathala00/jow/main/output.json');
                allChannels = await res.json();
                renderCategories();
                updateBookmarkCount();
                filterAndRender();
            } catch (e) { grid.innerHTML = `<div class="empty-box">Failed to load channels.</div>`; }
        }

        function renderCategories() {
            const cats = ['All', ...new Set(allChannels.map(ch => ch.group).filter(g => g))].sort();
            catInner.innerHTML = cats.map(cat => `<span class="cat-chip ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</span>`).join('');
            
            document.querySelectorAll('.cat-chip').forEach(chip => {
                chip.onclick = () => {
                    activeCategory = chip.dataset.cat;
                    showingBookmarksOnly = false;
                    document.getElementById('bookmarkHeaderBtn').classList.remove('active');
                    renderCategories(); filterAndRender();
                };
            });
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase();
            let filtered = allChannels.filter(ch => {
                const matchCat = showingBookmarksOnly ? bookmarks.includes(String(ch.id)) : (activeCategory === 'All' || ch.group === activeCategory);
                const matchSearch = ch.name.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            grid.innerHTML = filtered.length ? filtered.map(ch => `
                <div class="channel-card" onclick="openModal('${ch.name}', '${ch.link}')">
                    <div class="bookmark-btn ${bookmarks.includes(String(ch.id)) ? 'active' : ''}" onclick="event.stopPropagation(); toggleBookmark('${ch.id}', this)">
                        <i class="fas fa-bookmark"></i>
                    </div>
                    <div class="card-logo"><img src="${ch.logo || ''}" loading="lazy"></div>
                    <div class="card-name">${ch.name}</div>
                    ${ch.name.includes('HD') ? '<span class="hd-badge">HD</span>' : ''}
                </div>
            `).join('') : '<div class="empty-box">No channels found.</div>';
        }

        window.toggleBookmark = (id, btn) => {
            const idx = bookmarks.indexOf(String(id));
            if (idx === -1) bookmarks.push(String(id)); else bookmarks.splice(idx, 1);
            localStorage.setItem('jio_bookmarks', JSON.stringify(bookmarks));
            btn.classList.toggle('active');
            updateBookmarkCount();
            if (showingBookmarksOnly) filterAndRender();
        };

        function updateBookmarkCount() {
            const count = document.getElementById('bookmarkCount');
            count.textContent = bookmarks.length;
            count.style.display = bookmarks.length ? 'flex' : 'none';
        }

        document.getElementById('bookmarkHeaderBtn').onclick = function() {
            showingBookmarksOnly = !showingBookmarksOnly;
            this.classList.toggle('active');
            filterAndRender();
        };

        window.openModal = (name, link) => {
            document.getElementById('modalChannelName').textContent = name;
            document.getElementById('playLink').href = link;
            modalOverlay.classList.add('show');
        };

        document.getElementById('closeModalBtn').onclick = () => modalOverlay.classList.remove('show');
        searchInput.oninput = () => filterAndRender();
        loadData();
    })();
</script>
</body>
</html>
